<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprendice — abertura</title>
<!--
  Abertura do Aprendice, isolada do app para referencia.
  Origem: app-atual/design/shell.html (bloco "logotipo Aprendice") + app-atual/design/marca/logo.json.
  O que acontece: a palavra "Aprendice" e' escrita a mao no centro (traco em velocidade constante, ~1,1 s),
  o traco vira o logotipo exato (fade cruzado de 220 ms) e o logotipo voa para o canto da barra lateral (480 ms).
  Clique pula a animacao. Sem animacao para quem pede "reduzir movimento" no sistema.
  Na tela estreita (sem barra lateral) o logotipo some em fade em vez de voar.
  Parametros de URL: ?tema=escuro  ?atraso=700 (ms antes de comecar; usado para gravar o video)
-->
<style>
:root{
  --fundo:#F1F1EE; --lado:#FFFFFF; --borda:#E5E5E0; --texto:#17181C; --sub:#585B64;
  --fonte:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --fundo:#0C0D10; --lado:#131418; --borda:#25272D; --texto:#EDEEF1; --sub:#A3A6B0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fundo);color:var(--texto);font-family:var(--fonte);font-size:16px;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
.lado{flex:0 0 244px;background:var(--lado);border-right:1px solid var(--borda);box-shadow:1px 0 0 rgba(21,25,51,.02),4px 0 16px -6px rgba(21,25,51,.08);position:relative;z-index:2;display:flex;flex-direction:column;padding:18px 12px 12px;gap:2px}
.logo{display:flex;align-items:center;padding:4px 12px 22px}
.marca-ap{display:block;width:150px;height:48px;color:var(--texto);margin:-6px 0 -4px}
.marca-ap svg{display:block;width:100%;height:100%}
.item{padding:10px 12px;border-radius:10px;color:var(--sub);font-size:15px}
.item.on{background:color-mix(in srgb,#5B4BE0 12%,var(--lado));color:var(--texto);font-weight:600}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;color:var(--sub)}
main button{font:600 15px var(--fonte);padding:10px 18px;border-radius:10px;border:1px solid var(--borda);background:var(--lado);color:var(--texto);cursor:pointer}
@media (max-width:900px){.lado{display:none}}
/* abertura: o "Aprendice" e' escrito a mao no centro e voa para a barra lateral (igual ao shell.html) */
#abertura{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:var(--fundo);cursor:pointer;transition:opacity .3s ease}
#abertura .lg{will-change:transform;width:min(560px,70vw);color:var(--texto)}
#abertura .lg svg{display:block;width:100%;height:auto}
#abertura.sai{opacity:0;pointer-events:none}
</style>
</head>
<body>
<aside class="lado" aria-label="Menu">
  <div class="logo"><span class="marca-ap" id="marca-ap" role="img" aria-label="Aprendice"></span></div>
  <div class="item on">Início</div>
  <div class="item">Biologia</div>
  <div class="item">Química</div>
  <div class="item">Matemática</div>
  <div class="item">Português</div>
</aside>
<main>
  <p>Abertura do Aprendice</p>
  <div><button type="button" id="repetir">Repetir</button> <button type="button" id="tema">Tema escuro</button></div>
</main>

<meta charset="utf-8">
<title>Biologia São Camilo</title>
<style>
/* Caderno de prova: papel grafite, malha quadriculada, marcação da folha de respostas na cor da
   matéria. Cada matéria tem a sua: matemática índigo, biologia verde-musgo.
   O verde da matéria é OLIVA de propósito: o verde de "acertou" (--certo) é um verde-grama
   azulado, e usar os dois no mesmo tom faria a marca da página competir com o sinal de acerto. */
:root{
  --papel:#F3F4F1; --folha:#FFFFFF; --folha2:#FAFAF7;
  --tinta:#15171C; --lapis:#5B6068; --linha:#DEDFD8; --malha:#E7E8E1;
  --acento:#2E7D22; --acento-sv:#DEF2D8; --acento-ink:#FFFFFF;
  --certo:#13693F; --certo-bg:#DFF2E6; --errado:#A3231B; --errado-bg:#FBE5E2;
  --aviso:#8A5A00; --aviso-bg:#FDF2DA;
  /* a etiqueta de dificuldade tem texto BRANCO por cima: no tema claro o #8A7A1E de --d2 dava
     so' 4,30:1 e reprovava (os outros tres passam: 4,71 / 5,04 / 7,39). #7A6B18 da 5,32. */
  --d1:#4B7F52; --d2:#7A6B18; --d3:#A35E12; --d4:#9B2F2F;
  --disp:'Archivo','Segoe UI',system-ui,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px; --sombra:0 1px 2px rgba(21,23,28,.07),0 8px 24px rgba(21,23,28,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#101217; --folha:#191C23; --folha2:#1F232B;
  --tinta:#EDEEF2; --lapis:#A4AAB5; --linha:#2E333D; --malha:#232831;
  --acento:#6FCB5E; --acento-sv:#163113; --acento-ink:#101217;
  --certo:#6FDBA0; --certo-bg:#112E20; --errado:#FF9D93; --errado-bg:#331613;
  --aviso:#F0C96B; --aviso-bg:#2E2510;
  --d1:#86C58D; --d2:#D6C45E; --d3:#E39B55; --d4:#F08A8A;
  --sombra:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#101217; --folha:#191C23; --folha2:#1F232B;
  --tinta:#EDEEF2; --lapis:#A4AAB5; --linha:#2E333D; --malha:#232831;
  --acento:#6FCB5E; --acento-sv:#163113; --acento-ink:#101217;
  --certo:#6FDBA0; --certo-bg:#112E20; --errado:#FF9D93; --errado-bg:#331613;
  --aviso:#F0C96B; --aviso-bg:#2E2510;
  --d1:#86C58D; --d2:#D6C45E; --d3:#E39B55; --d4:#F08A8A;
  --sombra:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--serif);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--acento);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,.disp{font-family:var(--disp);letter-spacing:-.2px}
.mono{font-family:var(--mono)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--papel);
  border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px;padding:13px 0 10px;margin-bottom:16px}
.marca{font-family:var(--disp);font-weight:800;font-size:17px;flex:1;min-width:0;letter-spacing:-.3px}
.marca em{font-style:normal;color:var(--acento)}
.ic{width:36px;height:36px;border-radius:9px;border:1px solid var(--linha);background:var(--folha);display:grid;place-items:center;flex:none;font-size:14px}

.painel{background:var(--folha);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.capa{padding:20px 18px;background:
   linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 100%),
   repeating-linear-gradient(var(--malha) 0 1px,transparent 1px 22px),
   repeating-linear-gradient(90deg,var(--malha) 0 1px,transparent 1px 22px),var(--folha);
  border:1px solid var(--linha);border-radius:var(--r)}
.capa h1{font-size:25px;line-height:1.12;margin:0 0 6px;text-wrap:balance}
.capa p{margin:0;color:var(--lapis);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 14px}
.kpi{background:var(--folha);border:1px solid var(--linha);border-radius:9px;padding:9px 10px;min-width:0}
.kpi b{display:block;font-family:var(--mono);font-weight:600;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-family:var(--disp);font-size:10px;letter-spacing:.6px;color:var(--lapis);text-transform:uppercase}
.btn{display:block;width:100%;text-align:center;background:var(--acento);color:var(--acento-ink);border-radius:9px;
  padding:14px;font-family:var(--disp);font-weight:700;font-size:16px;transition:filter .12s,transform .12s}
.btn:active{transform:scale(.99);filter:brightness(1.1)}
.btn.sec{background:var(--folha);color:var(--tinta);border:1px solid var(--linha);margin-top:8px;font-size:14.5px}
h2.sec{font-family:var(--disp);font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--lapis);margin:24px 0 9px;font-weight:700}

/* módulos */
.mod{margin-bottom:8px;overflow:hidden}
.mod>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:12px 13px}
.mod>summary::-webkit-details-marker{display:none}
.mod .nm{flex:1;min-width:0;font-family:var(--disp);font-weight:700;font-size:15px}
.mod .nm small{display:block;font-family:var(--mono);font-weight:400;color:var(--lapis);font-size:11.5px;letter-spacing:.2px}
.prog{width:74px;height:6px;border-radius:3px;background:var(--linha);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--acento)}
.pc{font-family:var(--mono);font-size:11.5px;color:var(--lapis);width:34px;text-align:right;flex:none}
.corpo{border-top:1px solid var(--linha);padding:12px 13px;background:var(--folha2)}
.teoria p{margin:0 0 9px;font-size:15.2px}
.form{display:flex;flex-direction:column;gap:6px;margin:10px 0;padding:11px 12px;background:var(--folha);border:1px solid var(--linha);border-radius:8px}
.form div{font-family:var(--mono);font-size:13.4px;line-height:1.45}
.cuida{background:var(--aviso-bg);border-radius:8px;padding:9px 11px;font-size:14px;margin-bottom:12px}
.cuida b{color:var(--aviso);font-family:var(--disp);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;display:block}
.sub{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:1px solid var(--linha);background:var(--folha);margin-bottom:6px}
.sub .t{flex:1;min-width:0;font-size:14.5px}
.sub .q{font-family:var(--mono);font-size:11.5px;color:var(--lapis);flex:none}
.sub .falta{font-family:var(--mono);font-size:10px;color:var(--aviso);background:var(--aviso-bg);padding:2px 6px;border-radius:20px;flex:none}

/* questão */
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;padding:3px 8px;border-radius:20px;background:var(--acento-sv);color:var(--acento)}
.tag.dif{color:#fff}
.dif1{background:var(--d1)}.dif2{background:var(--d2)}.dif3{background:var(--d3)}.dif4{background:var(--d4)}
:root[data-theme="dark"] .tag.dif,:root:not([data-theme="light"]) .tag.dif{color:#101217}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tag.dif{color:#fff}}
.enun{background:var(--folha);border:1px solid var(--linha);border-radius:var(--r);padding:26px 22px;box-shadow:var(--sombra)}
.enun .txt{font-size:19.5px;white-space:pre-wrap;line-height:1.72;max-width:62ch}
.enun .txt b{font-weight:700}
.pergunta{font-family:var(--disp);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lapis);margin:0 0 12px}
.enun img{max-width:100%;display:block;border-radius:6px;background:#fff}
.alts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.alt{display:flex;gap:13px;align-items:center;padding:15px 15px;border:1.5px solid var(--linha);border-radius:11px;
  background:var(--folha);text-align:left;width:100%;transition:border-color .12s,background .12s}
.alt .bol{width:30px;height:30px;border-radius:50%;border:1.8px solid var(--lapis);display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;flex:none;color:var(--lapis)}
.alt .co{flex:1;min-width:0;font-size:17.5px;line-height:1.45}
.alt img{max-width:100%}
.alt.sel{border-color:var(--acento);background:var(--acento-sv)}
.alt.sel .bol{border-color:var(--acento);background:var(--acento);color:var(--acento-ink)}
.alt.certo{border-color:var(--certo);background:var(--certo-bg)}
.alt.certo .bol{border-color:var(--certo);background:var(--certo);color:var(--certo-bg)}
.alt.errado{border-color:var(--errado);background:var(--errado-bg)}
.alt.errado .bol{border-color:var(--errado);background:var(--errado);color:var(--errado-bg)}
.veredito{margin-top:20px;border-radius:11px;padding:16px 18px;font-size:16.5px;line-height:1.5}
.veredito.v1{background:var(--certo-bg)} .veredito.v0{background:var(--errado-bg)}
.veredito b{font-family:var(--disp);display:block;margin-bottom:5px;font-size:18px}
.veredito.v1 b{color:var(--certo)} .veredito.v0 b{color:var(--errado)}
.passos{counter-reset:p;margin:12px 0 0;padding:0;list-style:none}
.passos li{counter-increment:p;position:relative;padding:0 0 0 30px;margin-bottom:9px;font-size:15.3px;line-height:1.5}
.passos li::before{content:counter(p);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;
  background:var(--acento-sv);color:var(--acento);font-family:var(--mono);font-size:11px;display:grid;place-items:center;font-weight:600}
.fonte{font-family:var(--mono);font-size:11.5px;color:var(--lapis);line-height:1.6;word-break:break-word}
details.ficha{margin-top:18px;border-top:1px solid var(--linha);padding-top:10px}
details.ficha>summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--lapis);letter-spacing:.4px}
details.ficha>summary::-webkit-details-marker{display:none}
details.ficha>summary::before{content:"＋ ";font-weight:700}
details.ficha[open]>summary::before{content:"－ "}
details.ficha .fonte{margin-top:9px}
.resolucao{margin-top:22px;background:var(--folha2);border:1px solid var(--linha);border-radius:var(--r);padding:22px 20px}
.resolucao h3{font-family:var(--disp);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lapis);margin:0 0 4px}
.resolucao .conc{font-size:15px;color:var(--lapis);margin:0 0 16px;line-height:1.5}
.resolucao .passos li{font-size:17px;line-height:1.6;margin-bottom:14px}
.sep{height:1px;background:var(--linha);margin:20px 0}
.fonte a{color:var(--acento)}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.nav2{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.nav2 .volta{font-family:var(--disp);font-size:13px;color:var(--acento);font-weight:600}
.nav2 .cont{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--lapis)}
.cronometro{font-family:var(--mono);font-size:13px;color:var(--lapis)}
.btn-pausa{font-family:var(--mono);font-size:14px;line-height:1;color:var(--acento);background:transparent;border:1.5px solid var(--linha);border-radius:8px;padding:4px 9px;cursor:pointer}
.btn-pausa.pausado{background:var(--acento);color:#fff;border-color:var(--acento)}

/* listas e tabelas */
.linha{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--linha);font-size:14.5px}
.linha:last-child{border-bottom:0}
.linha .nm{flex:1;min-width:0}
.bolinha{width:8px;height:8px;border-radius:50%;background:var(--linha);flex:none}
.b-ok{background:var(--certo)} .b-err{background:var(--errado)} .b-rev{background:var(--aviso)}
.vazio{text-align:center;padding:34px 18px;color:var(--lapis)}
.vazio b{display:block;font-family:var(--disp);font-size:18px;color:var(--tinta);margin-bottom:5px}
.dica{font-size:13.4px;color:var(--lapis);line-height:1.55;margin-top:10px}
.aviso-box{background:var(--aviso-bg);border-radius:9px;padding:11px 13px;font-size:14px;margin-top:12px}
.aviso-box b{color:var(--aviso)}

nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--folha);border-top:1px solid var(--linha);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));display:flex;gap:4px}
nav.bot button{flex:1;padding:7px 2px;border-radius:9px;font-family:var(--disp);font-size:10.5px;letter-spacing:.3px;
  color:var(--lapis);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav.bot button em{font-style:normal;font-family:var(--mono);font-size:15px}
nav.bot button.on{color:var(--acento);background:var(--acento-sv)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* em 390 px "QUESTÕES REAIS" quebrava em duas linhas e esticava os seis quadros juntos */
@media (max-width:400px){.capa h1{font-size:21px}.kpi b{font-size:17px}
  .kpi{padding:9px 8px}.kpi span{font-size:9.5px;letter-spacing:.2px}}
/* ---- tela cheia / modo foco / telas largas (iPad) ---- */
@media (min-width:760px){
  .wrap{max-width:1040px;padding:0 30px 112px}
  body{font-size:17.5px}
  .kpis{grid-template-columns:repeat(6,1fr)}
  .capa{padding:26px 24px}
  .capa h1{font-size:31px}
  .enun .txt{font-size:21px}
  /* as regras das bolhas ficam no fim do arquivo, junto da definição delas:
     aqui elas vinham ANTES e eram vencidas pela regra base, sem fazer efeito nenhum */
  #v-questao .nav2,#q-corpo{max-width:680px;margin-left:auto;margin-right:auto}
  nav.bot{padding:9px 8px calc(9px + env(safe-area-inset-bottom,0px))}
  nav.bot button{font-size:12px;padding:9px 2px}
  nav.bot button em{font-size:18px}
  #modulos{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  #e-degraus{max-width:720px}
}
@media (min-width:1100px){ .wrap{max-width:1180px} }

html.foco header.top{display:none}
html.foco .wrap{padding-top:14px}
html.foco section > :first-child{padding-right:48px}
html.foco #sair-foco{display:grid}
#sair-foco{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:60;
  width:38px;height:38px;border-radius:10px;border:1px solid var(--linha);background:var(--folha);
  place-items:center;font-size:15px;box-shadow:var(--sombra);opacity:.85}
:fullscreen body,:-webkit-full-screen body{background:var(--papel)}
.aviso-tela{margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--lapis);line-height:1.55}
.aviso-tela a{color:var(--acento)}
/* ===== resolução v2 ===== */
.bloco{margin-top:22px}
.bloco:first-child{margin-top:0}
.bloco>h3{font-family:var(--disp);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lapis);
  margin:0 0 9px;display:flex;align-items:center;gap:8px}
.bloco>h3::after{content:"";flex:1;height:1px;background:var(--linha)}
.antes{background:var(--folha);border:1px solid var(--linha);border-radius:10px;padding:15px 16px}
.antes p{margin:0;font-size:16.5px;line-height:1.62}
.formula{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.formula code{display:block;font-family:var(--mono);font-size:14.5px;line-height:1.5;background:var(--folha2);
  border-left:3px solid var(--acento);border-radius:0 7px 7px 0;padding:9px 12px;white-space:pre-wrap;word-break:break-word}
/* Em biologia o "simbolo" e' um termo inteiro ("isolamento geografico"), nao um sinal.
   Com as duas colunas lado a lado, o termo comprido espremia a definicao em duas palavras
   por linha. Empilhado, o termo fica em cima e a explicacao embaixo, com a largura toda. */
.simbolos{margin-top:13px;display:block}
.simbolos dt{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--acento);
  margin-top:11px;line-height:1.35}
.simbolos dt:first-child{margin-top:0}
.simbolos dd{margin:3px 0 0;padding-left:11px;border-left:2px solid var(--linha);
  font-size:14.5px;line-height:1.55;color:var(--lapis)}
.passo{display:grid;grid-template-columns:26px 1fr;gap:12px;margin-bottom:16px}
.passo .nn{width:26px;height:26px;border-radius:50%;background:var(--acento-sv);color:var(--acento);
  font-family:var(--mono);font-size:13px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.passo .faz{font-family:var(--disp);font-size:16.5px;font-weight:600;line-height:1.35;margin:0}
.passo .conta{font-family:var(--mono);font-size:15px;line-height:1.6;margin:8px 0 0;padding:10px 12px;
  background:var(--folha);border:1px solid var(--linha);border-radius:8px;white-space:pre-wrap;
  word-break:break-word;overflow-wrap:anywhere}
.passo .porque{margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--lapis)}
.resp{background:var(--acento-sv);border:1px solid var(--acento);border-radius:10px;padding:14px 16px;
  font-family:var(--disp);font-size:17px;font-weight:600;line-height:1.4}
.checa{font-size:15.5px;line-height:1.62;margin:0;color:var(--lapis)}
.errada{display:grid;grid-template-columns:28px 1fr;gap:11px;padding:11px 0;border-top:1px solid var(--linha)}
.errada:first-of-type{border-top:0;padding-top:0}
.errada .L{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--folha);
  border:1px solid var(--linha);font-family:var(--disp);font-weight:700;font-size:14px;color:var(--lapis)}
.errada p{margin:0;font-size:15px;line-height:1.6;color:var(--lapis)}
.errada.sua{background:var(--errado-bg);border-radius:10px;padding:12px;border-top:0;margin-top:4px}
.errada.sua .L{background:var(--errado);border-color:var(--errado);color:var(--errado-bg)}
.errada.sua p{color:var(--tinta)}
.errada.sua .marca{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--errado);margin-bottom:4px}
.armad{background:var(--aviso-bg);border-radius:10px;padding:14px 16px;font-size:15.8px;line-height:1.6}
.armad b{color:var(--aviso);font-family:var(--disp);display:block;margin-bottom:4px;font-size:12px;
  letter-spacing:1.2px;text-transform:uppercase}
.pista-box{margin-top:14px;background:var(--aviso-bg);border-radius:10px;padding:13px 15px;font-size:15.5px;line-height:1.6}
.pista-box b{display:block;font-family:var(--disp);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--aviso);margin-bottom:5px}
.b-pista{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--lapis);display:block;
  border:1px dashed var(--linha);border-radius:8px;padding:9px;width:100%;text-align:center}
.alerta-box{background:var(--aviso-bg);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.55;margin-top:14px}
.alerta-box b{color:var(--aviso)}
@media (min-width:760px){
  .passo .faz{font-size:17.5px}
  .antes p{font-size:17.5px}
}
.print{position:relative}
/* o rodape fica SEMPRE sobre o papel branco do print, nos dois temas: por isso a cor e' cravada.
   #9a968c dava 2,83:1 sobre #fbfaf7 — ilegivel a 10px. #6E6A5F da 5,17:1. */
.print-pe{font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:#6E6A5F;text-transform:uppercase;

<style>
/* ---- questão em print da prova ---- */
.print{background:#fff;border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.print img{display:block;width:100%;height:auto}
.print .carregando{padding:28px 18px;text-align:center;color:var(--lapis);font-family:var(--mono);font-size:12px}
/* O limite tem de ser de LARGURA, não de altura: com max-height a bolha larga continuava
   crescendo de lado e o aspect-ratio 1/1 era vencido pelo teto de altura — num iPhone grande
   ou no iPad as cinco bolinhas viravam elipses. Limitando a largura, o 1/1 sempre fecha. */
.bolhas{display:flex;gap:9px;margin-top:16px;justify-content:space-between}
.bolha{flex:1;aspect-ratio:1/1;max-width:66px;border:2px solid var(--linha);border-radius:50%;background:var(--folha);
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:21px;color:var(--lapis);
  transition:transform .12s ease,border-color .12s,background .12s,color .12s}
.bolha:active{transform:scale(.93)}
.bolha.sel{border-color:var(--acento);background:var(--acento);color:var(--acento-ink);transform:scale(1.04)}
.bolha.certo{border-color:var(--certo);background:var(--certo);color:var(--certo-bg);animation:pulsa .5s ease}
.bolha.errado{border-color:var(--errado);background:var(--errado);color:var(--errado-bg);animation:treme .4s ease}
.bolha.apaga{opacity:.35}
@keyframes pulsa{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes treme{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.entra{animation:entra .26s cubic-bezier(.2,.7,.3,1) both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.entra2{animation:entra .34s cubic-bezier(.2,.7,.3,1) .06s both}
@media (min-width:760px){
  .bolhas{gap:14px;max-width:476px}   /* 5 × 84 + 4 × 14 = 476: fecha certo, sem sobra */
  .bolha{max-width:84px;font-size:25px}
}
.texto-toggle{margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--acento);display:block}
.nota-fonte{margin-top:12px;padding:12px 14px;border-left:3px solid var(--aviso);
  background:var(--aviso-bg);border-radius:0 9px 9px 0;font-size:14.5px;line-height:1.6}
.texto-box{margin-top:10px;padding:14px 15px;background:var(--folha2);border:1px solid var(--linha);border-radius:9px;
  font-size:16px;line-height:1.6;white-space:pre-wrap}
.texto-box .alt-t{margin-top:8px;font-size:15.5px}
.degrau{animation:entra .3s cubic-bezier(.2,.7,.3,1) both}
.barra-degrau{transition:width .45s cubic-bezier(.3,.8,.3,1)}
@media (prefers-reduced-motion:reduce){.entra,.entra2,.degrau,.bolha.certo,.bolha.errado{animation:none!important}}
/* ---- questão ampliada: toque no print ----
   O print tem 900 px de largura e no celular de 390 e' desenhado com ~356 (escala 0,40): o
   enunciado da fonte cai para algo em torno de 6 px de CSS. E' A leitura principal do aplicativo,
   e era a unica melhoria grande que a revisao de tela deixou em aberto. Tocar no print abre esta
   camada, que rola e amplia ate' 4x. Ela mostra a MESMA imagem, com o MESMO corte do rodape do
   site: nenhum gabarito entra aqui. */
.print{cursor:zoom-in}
.print[role="button"]:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
/* a dica fica na tarja do rodape, nao por cima da imagem: solta sobre o print ela cobria a
   ultima alternativa nas questoes de alternativa comprida */
.print-lupa{font-family:var(--mono);font-size:10px;letter-spacing:.4px;text-transform:uppercase;
  color:#3E3A31;background:#F1EEE6;border:1px solid #DAD5C8;border-radius:999px;padding:3px 9px;
  white-space:nowrap;pointer-events:none}
#lupa{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:var(--papel)}
#lupa[hidden]{display:none}

#lupa-nivel{font-family:var(--mono);font-size:11px;color:var(--lapis);min-width:52px;text-align:center}

/* ---- forma nova: em uma olhada, tipo do passo, figura, glossario ---- */

<style id="ad-design">
/* ==== AD-CSS inicio ==== */
/* 31/10 (video do Vitor): a pagina so aparece depois que a camada de design terminou de pintar; antes disso o navegador
   mostrava por um instante o app antigo (layout e tema velhos). Se algo falhar, aparece sozinha em 5 s. */
html:not(.ad-pronto) body{visibility:hidden!important;animation:ad-mostra 0s linear 5s forwards}
@keyframes ad-mostra{to{visibility:visible}}
/* ==== APRENDICE · design da materia (reescrito 29/10, critica de design: 25 itens + 15 bugs) ====
   Regras da casa:
   - base cinza neutra; UMA cor por materia (caderno do Vitor). --ad-c = cor de preenchimento (botao, barra),
     --ad-t = cor de texto sobre a pagina (AA), --ad-ink = texto sobre a cor (AA). Roxo nao entra aqui.
   - destaque so no que importa (questao, painel da resolucao, capa); o secundario fica sem caixa.
   - hover so com mouse; foco de teclado sempre visivel; movimento so em prefers-reduced-motion: no-preference. */
html.ad[data-theme="dark"]{
  --papel:#0C0D10; --folha:#16171B; --folha2:#1D1F24; --tinta:#EDEEF1; --lapis:#A3A6B0; --fraco:#8C8F99;
  --linha:#25272D; --borda2:#32353D; --malha:#1A1B1F;
  --certo:#2FD39A; --certo-bg:#0F2A22; --errado:#FF7B6B; --errado-bg:#2E1714; --aviso:#F5C451; --aviso-bg:#2A2312;
  --d1:#3FBF8A; --d2:#E7C14B; --d3:#F08A3E; --d4:#FF7B6B;
  --ad-ink:#0C0D10; --sombra-c:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.22);
  /* caderno noturno: mesma letra de mao, folha escura quente, sem o bloco quase branco no meio do painel */
  --papel-cad:#1C1B18; --grade-cad:#2E2C27; --tinta-cad:#EFE8CF; --caneta-verm:#FF8A7A; --marca-cad:rgba(255,214,90,.28); --borda-cad:#34312A; --grade-suave:color-mix(in srgb,#2E2C27 45%,#1C1B18); --leg-cad:#B9B3A0;
  color-scheme:dark;
}
html.ad[data-theme="light"]{
  --papel:#F1F1EE; --folha:#FFFFFF; --folha2:#F4F4F1; --tinta:#17181C; --lapis:#585B64; --fraco:#62656F;
  --linha:#E5E5E0; --borda2:#D6D6D0; --malha:#EEEEEA;
  --certo:#0E8F60; --certo-bg:#E2F6EE; --errado:#B3302A; --errado-bg:#FCEAE7; --aviso:#8A6200; --aviso-bg:#FBF1DA;
  --d1:#177E52; --d2:#7A6B18; --d3:#A35E12; --d4:#B4362C;
  --ad-ink:#FFFFFF; --sombra-c:0 1px 2px rgba(21,25,51,.05),0 8px 22px rgba(21,25,51,.06);
  --papel-cad:#FBF7EA; --grade-cad:#D6E4F0; --tinta-cad:#1C2F74; --caneta-verm:#C0392B; --marca-cad:#FFE36E; --borda-cad:#E6DCC0; --grade-suave:color-mix(in srgb,#D6E4F0 38%,#FBF7EA); --leg-cad:#5A5F7A;
  color-scheme:light;
}
/* codigo de cores do caderno (escuro: tinta #0C0D10 sobre a cor = Bio 10,1 · Mat 10,1 · Qui 6,4 · Por 12,1) */
html.ad.m-bio{--ad-c:#56D364;--ad-t:#56D364} html.ad.m-mat{--ad-c:#2CCFD0;--ad-t:#2CCFD0}
html.ad.m-qui{--ad-c:#F45D9C;--ad-t:#F45D9C} html.ad.m-por{--ad-c:#F7C548;--ad-t:#F7C548}
/* claro: branco sobre a cor = Bio 5,2 · Mat 5,2 · Qui 5,9; Por e amarelo de verdade com tinta escura (10,5) */
html.ad[data-theme="light"].m-bio{--ad-c:#177E36;--ad-t:#12692C}
html.ad[data-theme="light"].m-mat{--ad-c:#087884;--ad-t:#066570}
html.ad[data-theme="light"].m-qui{--ad-c:#C2185B;--ad-t:#A3124B}
html.ad[data-theme="light"].m-por{--ad-c:#F2C12E;--ad-t:#8A6200;--ad-ink:#17181C}
html.ad{
  --acento:var(--ad-t); --acento-ink:var(--ad-ink); --marca:var(--ad-c); --marca-ink:var(--ad-ink);
  --acento-sv:color-mix(in srgb,var(--ad-c) 15%,var(--folha));
  --anel-sel:inset 0 0 0 1.5px color-mix(in srgb,var(--ad-c) 60%,transparent);
  --disp:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --serif:"Literata",Georgia,serif; --sans:var(--disp);
  --mao:"Caveat","Segoe Print",cursive; --r:14px;
  --curva:cubic-bezier(.2,.7,.2,1); --entra:cubic-bezier(.05,.7,.1,1); --padrao:cubic-bezier(.2,0,0,1);
  font-feature-settings:normal;
}
html.ad body{font-family:var(--disp);font-size:17px;line-height:1.55;color:var(--tinta)}
html.ad .ic-ui{width:18px;height:18px;flex:none;display:block}
html.ad .ic-tema{display:block}
html.ad .num,html.ad .cronometro,html.ad [data-num],html.ad .mono,html.ad .pc,html.ad .sub .q,html.ad .degrau .num{font-variant-numeric:tabular-nums}
html.ad :focus-visible{outline:2px solid var(--ad-t);outline-offset:2px}
html.ad .bolha:focus-visible,html.ad .btn:focus-visible{outline-offset:3px}

/* dentro da pagina principal: o menu dela substitui cabecalho e barra de baixo */
html.ad.emshell header.top,html.ad.emshell nav.bot,html.ad.emshell #sair-foco{display:none!important}
html.ad .wrap{max-width:1440px;padding:22px 32px 48px}
@media (max-width:700px){html.ad .wrap{padding:14px 16px 32px}}

/* ---------- fundo: motivo da materia ATRAS do conteudo (z-index:-1 num body isolado) ---------- */
html.ad body{isolation:isolate;background:radial-gradient(1000px 560px at 100% 0%,color-mix(in srgb,var(--ad-c) 7%,transparent),transparent 70%),var(--papel);background-attachment:fixed}
html.ad body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:var(--ad-motivo) right top/min(720px,55vw) auto no-repeat;opacity:.06}
html.ad[data-theme="light"] body::before{opacity:.05}
html.ad .wrap{position:relative}

/* ---------- cabecalho da materia + filtros ---------- */
#ad-cab{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 14px}
#ad-cab .ad-tit{display:flex;align-items:center;gap:14px;min-width:0}
#ad-cab h1{margin:0;font:600 32px/1.1 var(--disp);letter-spacing:-.4px}
#ad-cab .ad-n{font-size:15px;color:var(--lapis);margin-top:4px}
.ad-filtros{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.ad-filtros button{border:0;background:transparent;color:var(--lapis);border-radius:9px;padding:8px 14px;font:500 15px var(--disp);cursor:pointer}
.ad-filtros button[aria-pressed="true"]{background:var(--acento-sv);color:var(--tinta);box-shadow:var(--anel-sel)}
.ad-filtros small{margin-left:6px;font-size:13px;color:var(--fraco);font-variant-numeric:tabular-nums}
.ad-filtros button[aria-pressed="true"] small{color:var(--lapis)}
/* filtro por banca so onde ele muda alguma coisa (escadas) */
html.ad:not([data-v="escada"]) .ad-filtros{display:none}

/* ---------- faixa de temas: sem caixa, anel de progresso, mascara nas bordas ---------- */
#ad-temas{position:relative;margin:0 -6px 22px}
#ad-temas .ad-rolo{display:flex;gap:4px;overflow-x:auto;padding:4px 6px 6px;scrollbar-width:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
#ad-temas .ad-rolo::-webkit-scrollbar{display:none}
.ad-tema{flex:0 0 auto;width:132px;min-height:120px;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:12px 8px;border-radius:14px;border:0;background:transparent;
  color:var(--ad-t);text-align:center;cursor:pointer;position:relative}
.ad-tema .ad-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.ad-tema .ad-ic::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--ad-c) calc(var(--p,0) * 1%),color-mix(in srgb,var(--tinta) 10%,transparent) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px))}
.ad-tema .ic-tema{width:34px;height:34px}
.ad-tema span:not(.ad-ic){font:500 14px/1.25 var(--disp);color:var(--tinta);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.ad-tema[aria-current="true"]{background:var(--acento-sv);box-shadow:var(--anel-sel)}
.ad-tema b{position:absolute;top:6px;right:8px;font:600 12px var(--disp);color:var(--tinta);background:color-mix(in srgb,var(--tinta) 10%,transparent);border-radius:20px;padding:0 6px;font-variant-numeric:tabular-nums}
.ad-tema.ad-zero{opacity:.38}
#ad-temas .ad-seta{position:absolute;top:44px;z-index:2;width:32px;height:32px;border-radius:50%;border:1px solid var(--borda2);background:var(--folha);color:var(--tinta);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#ad-temas .ad-seta svg{width:16px;height:16px}
#ad-temas .ad-seta.e{left:0} #ad-temas .ad-seta.d{right:0}
#ad-temas .ad-seta[hidden]{display:none}
/* modo foco: questao, simulado e resultado so com a barra compacta */
html.ad[data-v="questao"] #ad-cab,html.ad[data-v="questao"] #ad-temas,
html.ad[data-v="simulado-q"] #ad-cab,html.ad[data-v="simulado-q"] #ad-temas,
html.ad[data-v="resultado"] #ad-cab,html.ad[data-v="resultado"] #ad-temas{display:none}

/* ---------- componentes base ---------- */
html.ad .painel{background:transparent;border:0;border-radius:0;box-shadow:none}
html.ad h2.sec{font:600 19px var(--disp);letter-spacing:-.1px;text-transform:none;color:var(--tinta);margin:28px 0 10px}
html.ad .btn,html.ad .btn:not(.sec){font:600 16px var(--disp);border-radius:11px;padding:13px 20px;background:var(--ad-c);color:var(--ad-ink);box-shadow:none;border:0;width:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
html.ad .btn.sec{background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--tinta);border:0;box-shadow:none}
html.ad .tag{font:500 14px var(--disp);letter-spacing:0;padding:4px 10px;border-radius:20px;background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--tinta);border:0;text-transform:none}
html.ad .tag.dif{border:0}
html.ad[data-theme] .tag.dif.dif1{background:color-mix(in srgb,var(--d1) 18%,transparent);color:var(--d1)}
html.ad[data-theme] .tag.dif.dif2{background:color-mix(in srgb,var(--d2) 18%,transparent);color:var(--d2)}
html.ad[data-theme] .tag.dif.dif3{background:color-mix(in srgb,var(--d3) 18%,transparent);color:var(--d3)}
html.ad[data-theme] .tag.dif.dif4{background:color-mix(in srgb,var(--d4) 18%,transparent);color:var(--d4)}
html.ad .linha{display:flex;align-items:center;gap:12px;padding:13px 4px;font-size:16px;border-bottom:1px solid var(--linha);border-radius:0}
html.ad .linha:last-child{border-bottom:0}
html.ad .linha .mono,html.ad .linha .disp{font-family:var(--disp)}
html.ad .linha .mono{font-size:15px;color:var(--lapis)}
html.ad .dica{font-size:14px;color:var(--lapis)}
html.ad .vazio{padding:20px 16px;border:1px dashed var(--borda2);border-radius:12px;text-align:left;color:var(--lapis);font-size:15px}
html.ad .vazio b{font:600 16px var(--disp);color:var(--tinta);margin-bottom:2px}
/* sumarios: chevron desenhado no lugar de +/- */
html.ad details > summary{list-style:none}
html.ad details > summary::-webkit-details-marker{display:none}
html.ad details > summary::marker{content:""}
html.ad details.teoria-cx > summary::before,html.ad details.ficha > summary::before,html.ad details.ad-dados > summary::before,html.ad .mod > summary::after{
  content:"";width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px;margin-right:8px;background:currentColor;
  -webkit-mask:var(--ad-chev) center/contain no-repeat;mask:var(--ad-chev) center/contain no-repeat;transition:transform .15s var(--padrao)}
html.ad details[open].teoria-cx > summary::before,html.ad details[open].ficha > summary::before,html.ad details[open].ad-dados > summary::before,html.ad .mod[open] > summary::after{transform:rotate(90deg)}
html.ad .mod > summary::after{margin:0 0 0 4px;color:var(--fraco)}

/* ---------- inicio da materia: a capa e o destaque (tingida da cor da materia) ---------- */
html.ad .capa{position:relative;overflow:hidden;border-radius:18px;padding:26px 28px;box-shadow:none;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ad-c) 15%,var(--folha)),color-mix(in srgb,var(--ad-c) 4%,var(--folha)) 70%);
  border:1px solid color-mix(in srgb,var(--ad-c) 24%,transparent)}
html.ad .capa h1{font:600 32px/1.15 var(--disp);letter-spacing:-.4px;margin:0 0 6px}
html.ad .capa p{font-size:17px;color:var(--lapis);margin:0}
html.ad #v-inicio .capa{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,max-content) minmax(0,1fr) 220px;column-gap:12px;
  grid-template-areas:"tit tit tit arte" "sub sub sub arte" "stat stat stat arte" "b1 b2 . arte" "d1 d2 . arte"}
html.ad #v-inicio .capa > #i-tit{grid-area:tit} html.ad #v-inicio .capa > #i-sub{grid-area:sub}
html.ad #v-inicio .capa > .ad-stat{grid-area:stat}
html.ad #v-inicio .capa > .ad-arte{grid-area:arte;width:220px;height:150px;align-self:center;pointer-events:none}
html.ad #v-inicio .capa > .ad-arte svg{width:100%;height:100%}
html.ad #v-inicio .capa #b-treino{grid-area:b1;margin:18px 0 0!important} html.ad #v-inicio .capa #b-continuar{grid-area:b2;margin:18px 0 0!important}
html.ad #v-inicio .capa #treino-dica{grid-area:d1;margin:8px 0 0!important}
html.ad #v-inicio .capa:has(#b-continuar:not(.sec)) #b-continuar{grid-area:b1}
html.ad #v-inicio .capa:has(#b-continuar:not(.sec)) #b-treino{grid-area:b2}
html.ad #v-inicio .capa:has(#b-continuar:not(.sec)) #treino-dica{grid-area:d2}
html.ad #v-inicio .capa > .kpis,html.ad #b-simulado5,html.ad #sync,html.ad #aviso-tela,html.ad #v-inicio > p.dica,html.ad #aviso-cobertura,html.ad #v-simulado > p.dica{display:none!important}
html.ad #treino-dica{font-size:14px;color:var(--lapis);text-align:left}
.ad-stat{margin:14px 0 0;font-size:17px;color:var(--lapis)}
.ad-stat b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:899px){
  html.ad #v-inicio .capa{grid-template-columns:minmax(0,1fr);grid-template-areas:"tit" "sub" "stat" "b1" "d1" "b2" "d2";padding:22px 20px}
  html.ad #v-inicio .capa > .ad-arte{display:none}
  html.ad #v-inicio .capa .btn{width:100%}
  html.ad #v-inicio .capa:has(#b-continuar:not(.sec)) #treino-dica{grid-area:d2}
  html.ad #v-inicio .capa #b-continuar{margin-top:10px!important}
}
@media (min-width:1100px){
  html.ad #v-inicio:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;align-items:start}
  html.ad #v-inicio > *{grid-column:1 / -1}
  html.ad #v-inicio > h2.sec:has(+ #procedencia),html.ad #v-inicio > #procedencia{display:none}
}
html.ad #reforco .linha{cursor:pointer;border-radius:10px;padding:12px 10px}
html.ad #reforco .linha .mono{font-weight:600}

/* ---------- estudar: temas em lista, o aberto ganha folha ---------- */
html.ad #tit-modulos{font-size:18px}
html.ad #modulos{column-gap:28px}
html.ad .mod{background:transparent!important;border:0;border-bottom:1px solid var(--linha);border-radius:0;margin:0;overflow:visible}
html.ad .mod>summary{padding:14px 6px;gap:14px;border-radius:12px}
html.ad .mod .nm{font:600 17px var(--disp);display:flex;align-items:center;gap:14px}
html.ad .mod .nm .ic-tema{width:40px;height:40px;color:var(--ad-t);flex:none}
html.ad .mod .nm small{font:400 14px var(--disp);color:var(--lapis);margin-top:2px;letter-spacing:0}
html.ad .prog{height:6px;border-radius:9px;width:90px;background:color-mix(in srgb,var(--tinta) 10%,transparent)}
html.ad .prog i{border-radius:9px;background:var(--ad-c)}
html.ad .pc{font:500 14px var(--disp);color:var(--lapis);width:40px}

/* ---------- escada: a lista e a heroina; titulo sem cartao ---------- */

html.ad .escadabar i.ok{background:var(--certo)}

/* ---------- questao: barra compacta grudada no topo ---------- */
html.ad .atalhos-pc,html.ad #q-cont{display:none!important}
html.ad #v-questao .nav2{position:sticky;top:0;z-index:6;max-width:none;height:52px;margin:-22px -32px 18px;padding:0 32px;display:flex;align-items:center;gap:10px;

.ad-barq{flex:1;min-width:0;display:flex;align-items:center;gap:10px;position:relative;height:100%}

.ad-barq .n{font:600 16px var(--disp);flex:none}
.ad-barq .n::after{content:" ·";color:var(--fraco);font-weight:500}
.ad-barq .t{font:500 15px var(--disp);color:var(--lapis);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ad-barq .t b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}
.ad-barq .p{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}

html.ad .btn-pausa[hidden]{display:none}
html.ad .btn-pausa.pausado{background:var(--ad-c);color:var(--ad-ink)}
@media (max-width:520px){.ad-barq .n,html.ad .nav2 .volta span{display:none}}
@media (pointer:coarse){.ad-ajuda{display:none}}
@media (max-width:700px){.ad-filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%;margin-left:0}.ad-filtros button{flex:none}}
html.ad[data-v="resultado"] #v-questao .nav2 .ad-ajuda,html.ad[data-v="resultado"] #v-questao .nav2 .ad-barq .t,html.ad[data-v="resultado"] #v-questao .nav2 .ad-barq .p{display:none}

/* duas colunas; depois de responder, a resolucao ganha espaco */
html.ad #q-corpo.ad-q{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(340px,1fr);grid-template-rows:auto 1fr;gap:20px;align-items:start;max-width:none;margin:0;transition:grid-template-columns .3s var(--padrao)}
html.ad.ad-resp #q-corpo.ad-q{grid-template-columns:minmax(0,1fr) minmax(440px,1.25fr)}
html.ad #q-corpo.ad-q > *{grid-column:1;min-width:0}
html.ad #q-corpo.ad-q > .entra2{--ad-cp:16px;display:flex;flex-direction:column;grid-row:1;background:var(--folha);border:1px solid var(--linha);border-radius:18px;padding:16px var(--ad-cp) 0;box-shadow:var(--sombra-c)}
html.ad #q-corpo.ad-q > .entra2 > *{grid-column:auto}
/* print do banco (rev. final P1): usa toda a largura util da coluna; --ad-pw (JS) so o estreita quando ele cabe
   inteiro na altura util sem cair abaixo do tamanho legivel. As margens brancas laterais do proprio print saem
   (--lx/--zx, medidas no JS): o texto da fonte fica ~14% maior na mesma largura. Papel branco nos dois temas. */
html.ad #q-corpo.ad-q > .entra2 > .print{position:static;max-height:none;overflow:hidden;margin:14px auto 0;width:100%;max-width:var(--ad-pw,100%);grid-row:auto;border-radius:12px;border:0;box-shadow:0 0 0 1px var(--linha);background:#FFFFFF}
html.ad #q-corpo.ad-q > .entra2 > .print img{width:100%;max-width:none;margin-left:0;margin-right:0;display:block}
html.ad #q-corpo.ad-q > .entra2 > .print.ad-apara img{width:calc(100% * var(--zx,1));margin-left:calc(-100% * var(--lx,0))}
html.ad #q-corpo.ad-q > #ad-painel{grid-column:2;grid-row:1 / span 2;position:sticky;top:64px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
html.ad #q-corpo.ad-q > #ad-baixo{grid-column:1;grid-row:2;align-self:start}
@media (max-width:900px){html.ad #q-corpo.ad-q,html.ad.ad-resp #q-corpo.ad-q{grid-template-columns:minmax(0,1fr)}
  html.ad #q-corpo.ad-q > #ad-painel{grid-column:1;grid-row:2;position:static;max-height:none}
  html.ad #q-corpo.ad-q > #ad-baixo{grid-row:3}}
@media (max-width:700px){html.ad #q-corpo.ad-q > .entra2{--ad-cp:14px;padding:14px var(--ad-cp) 0;border-radius:16px}
  /* celular: o print vai de borda a borda da tela (tocar abre a lupa, com zoom ate 4x) */
  html.ad #q-corpo.ad-q > .entra2 > .print{width:auto;max-width:none;margin:12px calc(-1 * var(--ad-cp) - 16px) 0;border-radius:0;box-shadow:0 1px 0 var(--linha),0 -1px 0 var(--linha)}
  html.ad #q-corpo.ad-q > .entra2 > .print img{max-height:none}}
/* cabecalho do cartao: so as etiquetas e o marcador */
html.ad .entra2 > .qmeta{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0}
html.ad .entra2 > .qmeta .ad-marca{margin-left:auto}
.ad-marca{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--lapis);cursor:pointer;flex:none}
.ad-marca[aria-pressed="true"]{color:var(--aviso);background:var(--aviso-bg)}
.ad-marca svg{width:19px;height:19px}
html.ad #b-rev{display:none}
html.ad .mini-escada i{background:color-mix(in srgb,var(--tinta) 14%,transparent)}
html.ad .mini-escada i.ja{background:color-mix(in srgb,var(--ad-c) 50%,transparent)}
/* alternativas: uma linha de gabarito (o texto ja esta no print) */
html.ad #bolhas.bolhas{display:flex;flex-direction:row;gap:8px;max-width:none;width:auto;justify-content:stretch;
  margin:14px calc(-1 * var(--ad-cp,16px)) 0;padding:10px calc(var(--ad-cp,16px) + max(0px, (100% - var(--ad-pw,100%)) / 2)) 0;
  position:sticky;bottom:var(--ad-acH,0px);z-index:5;background:var(--folha)}
/* grudada no pe da tela: uma linha fina separa do print que passa por baixo */
html.ad .entra2.ad-preso > #bolhas.bolhas{box-shadow:0 -1px 0 var(--linha),0 -10px 18px -12px rgba(0,0,0,.25)}
html.ad .bolha{flex:1 1 0;min-width:0;max-width:none;aspect-ratio:auto;height:56px;border-radius:12px;border:1.5px solid var(--linha);background:var(--folha2);display:grid;place-items:center;
  padding:0;font:600 20px var(--disp);color:var(--tinta);position:relative;transform:none;transition:transform .1s var(--padrao),background-color .15s,border-color .15s,color .15s,opacity .2s}
html.ad .bolha.sel{background:var(--acento-sv);border-color:var(--ad-c);color:var(--tinta);transform:none}
html.ad .bolha:active:not(.certo):not(.errado){transform:scale(.97)}
html.ad .bolha.certo{background:var(--certo-bg);border-color:var(--certo);color:var(--certo);animation:none}
html.ad .bolha.errado{background:var(--errado-bg);border-color:var(--errado);color:var(--errado);animation:none}
html.ad .bolha.certo::after,html.ad .bolha.errado::after{content:"";position:absolute;top:6px;right:6px;width:14px;height:14px;background:currentColor;-webkit-mask:var(--ad-ok-m) center/contain no-repeat;mask:var(--ad-ok-m) center/contain no-repeat}
html.ad .bolha.errado::after{-webkit-mask-image:var(--ad-x-m);mask-image:var(--ad-x-m)}
html.ad .bolha.apaga{opacity:.45}
html.ad .bolha.riscada{opacity:.45;text-decoration:line-through;text-decoration-thickness:2px}
@media (max-width:700px){html.ad .bolha{height:58px}}
/* acoes: certeza a esquerda, dica + confirmar a direita, numa linha */
html.ad .entra2 > .acoes[hidden],html.ad #b-dica[hidden],html.ad .dica-box[hidden]{display:none!important}
html.ad .entra2 > .acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:none;width:auto;grid-template-columns:none;
  margin:0 calc(-1 * var(--ad-cp,16px));padding:10px calc(var(--ad-cp,16px) + max(0px, (100% - var(--ad-pw,100%)) / 2)) 14px;
  position:sticky;bottom:0;z-index:5;background:var(--folha);border-radius:0 0 17px 17px}
html.ad .entra2 > .acoes .btn{width:auto;margin:0!important;padding:11px 20px}
html.ad .entra2 > .acoes #b-conf,html.ad .entra2 > .acoes #b-prox{margin-left:auto!important;min-width:180px}
html.ad .entra2 > .acoes > :first-child:is(#b-conf,#b-prox){margin-left:auto!important}
html.ad .entra2 > .acoes #b-prox{order:5}
html.ad .entra2 > .acoes #b-refaz{background:transparent;color:var(--lapis);padding:11px 8px}
html.ad .entra2 > .acoes.ad-acoes2 #b-prox{min-width:0}
html.ad #q-corpo:not(:has(#bolhas .bolha.sel)) #b-conf{opacity:.5}
.ad-ant{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;background:color-mix(in srgb,var(--tinta) 7%,transparent);border-radius:10px;color:var(--tinta);cursor:pointer;padding:0}
.ad-ant svg{width:18px;height:18px}
html.ad #b-dica.b-pista{margin:0;width:auto;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:10px;padding:10px 10px;font:500 15px var(--disp)!important;color:var(--lapis);text-decoration:none}
html.ad #b-dica.b-pista::before{content:"";width:17px;height:17px;flex:none;background:currentColor;-webkit-mask:var(--ad-lamp) center/contain no-repeat;mask:var(--ad-lamp) center/contain no-repeat;color:var(--aviso)}
html.ad #b-dica small{font:500 13px var(--disp);color:var(--fraco);font-variant-numeric:tabular-nums}
.ad-conf{display:inline-flex;align-items:center;height:36px;padding:3px;gap:2px;border-radius:10px;background:color-mix(in srgb,var(--tinta) 7%,transparent);margin:0}
.ad-conf button{height:30px;border:0;background:transparent;color:var(--lapis);border-radius:8px;padding:0 12px;font:500 14px var(--disp);cursor:pointer;white-space:nowrap}
.ad-conf button[aria-checked="true"]{background:var(--folha);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.2),var(--anel-sel)}
html.ad .nota-fonte{margin-top:12px;font-size:15px}
@media (max-width:700px){
  /* a barra grudada vai de borda a borda, como o print (nada do print aparece pelas laterais) */
  html.ad .entra2 > .acoes{margin:0 calc(-1 * var(--ad-cp) - 16px);padding:8px calc(var(--ad-cp) + 16px) calc(10px + env(safe-area-inset-bottom));border-radius:0}
  html.ad #bolhas.bolhas{margin-left:calc(-1 * var(--ad-cp) - 16px);margin-right:calc(-1 * var(--ad-cp) - 16px);padding:8px calc(var(--ad-cp) + 16px) 0}
  html.ad .entra2.ad-preso > #bolhas.bolhas{box-shadow:0 -1px 0 var(--linha)}
  /* cabecalho do cartao mais curto: a banca ja aparece no pe do print; o marcador vai para o canto */
  html.ad .entra2 > .qmeta{position:relative;padding-right:40px}
  html.ad .entra2 > .qmeta > .tag:not(.dif):not(:last-of-type){display:none}
  html.ad .entra2 > .qmeta > .tag{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  html.ad .entra2 > .qmeta > .tag.dif{flex:none}

  html.ad .entra2 > .acoes #b-conf,html.ad .entra2 > .acoes #b-prox{flex:1 1 auto;min-width:0}
  .ad-conf{order:-1;flex:1 1 100%;justify-content:space-between}
  .ad-conf button{flex:1}
}

/* ---------- painel da direita: resolucao, teoria, fonte ---------- */
#ad-painel{background:var(--folha);border:1px solid var(--linha);border-radius:18px;box-shadow:var(--sombra-c);overflow:hidden}
.ad-abas{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--linha);flex:none}
.ad-abas button{position:relative;border:0;background:transparent;padding:14px 12px 13px;font:500 15px var(--disp);color:var(--lapis);cursor:pointer}
.ad-abas button[aria-selected="true"]{color:var(--tinta);font-weight:600}
.ad-abas button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--ad-c)}

.ad-aba[hidden]{display:none}

html.ad #ad-painel .dica-nivel p{font-size:16px}
html.ad #ad-painel .veredito{margin:0 0 6px;border-radius:14px;padding:14px 16px;font-size:16px;display:block;border:0}

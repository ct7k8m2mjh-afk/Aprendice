html.ad #ad-painel .veredito.v0{background:var(--errado-bg)}
html.ad #ad-painel .veredito > b:first-child{font:600 18px var(--disp);display:flex;align-items:center;gap:8px}
html.ad #ad-painel .veredito > b:first-child::before{content:"";width:22px;height:22px;border-radius:50%;flex:none;background:var(--certo) var(--ad-ok) center/14px no-repeat}
html.ad #ad-painel .veredito.v0 > b:first-child::before{background:var(--errado) var(--ad-x) center/12px no-repeat}
html.ad #ad-painel .veredito .oque{font-size:16px;line-height:1.55;color:var(--tinta);opacity:.9}
html.ad #ad-painel .resolucao{margin-top:14px;background:transparent;border:0;padding:0}
html.ad #ad-painel .bloco{margin-top:22px}
html.ad #ad-painel .bloco:first-child{margin-top:0}
html.ad #ad-painel .resolucao h3,html.ad #ad-painel .bloco > h3,html.ad .essencial h3{font:600 16px var(--disp);letter-spacing:0;text-transform:none;color:var(--tinta);margin:0 0 10px}
html.ad #ad-painel .bloco > h3::after{background:var(--linha)}
/* corpo da resolucao: 16 px / 1,6 para ler 2.000 px de texto */
html.ad #ad-painel p,html.ad #ad-painel .antes p,html.ad #ad-painel .ess p,html.ad #ad-painel .checa,html.ad #ad-painel .passo .porque,html.ad #ad-painel .errada p,html.ad #ad-painel .armad{font-size:17px;line-height:1.6}
html.ad #ad-painel .passo .faz{font:600 17px/1.4 var(--disp)}
html.ad #ad-painel .antes{background:transparent;border:0;padding:0}
html.ad .essencial{background:var(--acento-sv)!important;border:0!important;border-radius:14px!important;padding:14px 16px 8px!important}
html.ad .ess{grid-template-columns:72px 1fr;border-top-color:color-mix(in srgb,var(--tinta) 10%,transparent)}
html.ad .ess-r,html.ad #ad-painel .ess-r{font:600 13px/1.6 var(--disp)!important;letter-spacing:.02em!important;text-transform:none!important;color:var(--ad-t)}
html.ad .ess-r::first-letter{text-transform:uppercase}
html.ad .tipo{font:600 13px/1 var(--disp)!important;letter-spacing:.02em!important;text-transform:none!important;color:var(--ad-t);border:0;background:var(--acento-sv);padding:4px 9px 4px 7px;opacity:1}
html.ad .tipo i{display:none}
html.ad .tipo::before{content:"";width:14px;height:14px;flex:none;background:currentColor;-webkit-mask:var(--tp-concluir) center/contain no-repeat;mask:var(--tp-concluir) center/contain no-repeat}
html.ad .tipo[aria-label$="localizar"]::before{-webkit-mask-image:var(--tp-localizar);mask-image:var(--tp-localizar)}
html.ad .tipo[aria-label$="eliminar"]::before{-webkit-mask-image:var(--tp-eliminar);mask-image:var(--tp-eliminar)}
html.ad .tipo[aria-label$="calcular"]::before{-webkit-mask-image:var(--tp-calcular);mask-image:var(--tp-calcular)}
html.ad .tipo[aria-label$="comparar"]::before{-webkit-mask-image:var(--tp-comparar);mask-image:var(--tp-comparar)}
html.ad .simbolos dt{font:600 15px var(--disp);color:var(--ad-t)}
html.ad .simbolos dd{font-size:16px}
html.ad .passo .nn{font:600 13px var(--disp);background:var(--acento-sv);color:var(--ad-t)}
html.ad .errada .L{font:600 14px var(--disp);background:color-mix(in srgb,var(--tinta) 7%,transparent);border:0;color:var(--lapis)}
html.ad .errada.sua{background:var(--errado-bg)}
html.ad .errada.sua .L{background:var(--errado);color:var(--errado-bg)}
html.ad .errada.sua .marca{font:600 13px var(--disp)!important;letter-spacing:.02em!important;text-transform:none!important;color:var(--errado)}
html.ad .errada.sua .marca::first-letter{text-transform:uppercase}
html.ad .armad{background:var(--aviso-bg);border-radius:12px}
html.ad .armad b{color:var(--aviso)}
html.ad .aviso-box,html.ad .alerta-box{border-radius:12px}
html.ad #ad-painel #b-teoria{margin-top:16px;width:100%}
html.ad .gl-caixa b{color:var(--ad-t)}
html.ad .gl-fecha{background:var(--ad-c);color:var(--ad-ink);font-family:var(--disp)}
html.ad button.gl{border-bottom-color:var(--ad-t)}
.ad-volta{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--lapis);background:color-mix(in srgb,var(--tinta) 5%,transparent);border:0;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.ad-volta svg{width:18px;height:18px;color:var(--ad-t);flex:none}
.ad-volta b{color:var(--tinta)}
.ad-teo h4{margin:0 0 8px;font:600 18px var(--disp);display:flex;align-items:center;gap:10px}
.ad-teo h4 svg{width:32px;height:32px;color:var(--ad-t)}
.ad-teo p{font-size:16px;line-height:1.6;margin:0 0 10px}
/* fonte: lista de propriedades */
.ad-props{display:grid;grid-template-columns:140px 1fr;gap:0;margin:0 0 16px;font-size:16px}
.ad-props dt{color:var(--lapis);padding:9px 0;border-bottom:1px solid var(--linha)}
.ad-props dd{margin:0;padding:9px 0;border-bottom:1px solid var(--linha);font-weight:500;min-width:0;overflow-wrap:anywhere}
.ad-props dd .tag{margin-left:6px}
.ad-orig{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--tinta);font:500 15px var(--disp);text-decoration:none}
.ad-orig svg{width:16px;height:16px}
html.ad #ad-painel details.ficha{display:none}
html.ad #ad-painel .texto-toggle{margin-top:14px;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:10px;background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--tinta);font:500 15px var(--disp)!important}
html.ad .texto-box{font-size:16px;background:var(--folha2);border:0;border-radius:12px}
/* relacionados: secao comum no fim do painel */
.ad-rel{border-top:1px solid var(--linha);margin-top:24px;padding-top:16px}
.ad-rel h5{margin:0 0 10px;font:600 16px var(--disp)}
.ad-rel .ad-rg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
.ad-rel button{border:0;background:transparent;border-radius:10px;padding:8px 6px;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ad-t);min-width:0;text-align:left}
.ad-rel button svg{width:28px;height:28px;flex:none}
.ad-rel button span{font:500 14px/1.3 var(--disp);color:var(--tinta);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;min-width:0}
.ad-rel button i{display:none}
/* atalhos embaixo da questao: sem caixa */
#ad-baixo{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px;padding:4px 6px}
@media (max-width:600px){#ad-baixo{grid-template-columns:1fr}}
.ad-bx{min-width:0}
.ad-bx h5{display:none}
.ad-bx button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:10px 10px;text-align:left;cursor:pointer;color:var(--tinta)}
.ad-bx button > svg:first-child,.ad-bx button > .ic-tema:first-child{width:30px;height:30px;color:var(--ad-t);flex:none}
.ad-bx button .ad-tx{flex:1;min-width:0}
.ad-bx button .ad-tx b{display:block;font:500 15px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-bx button .ad-tx small{font-size:14px;color:var(--lapis)}
.ad-bx button > svg:last-child{width:16px;height:16px;color:var(--fraco);flex:none}

/* ---------- fim de treino / simulado / revisao ---------- */
html.ad #q-corpo:not(.ad-q){max-width:760px;margin:0 auto}
.ad-res{max-width:760px;margin:16px auto;background:var(--folha);border:1px solid var(--linha);border-radius:20px;padding:32px;text-align:center;box-shadow:var(--sombra-c)}
.ad-res-tit{margin:0;color:var(--lapis);font-size:17px;font-weight:500}
.ad-placar{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:6px 0 20px}
.ad-placar b{font:700 64px/1 var(--disp);font-variant-numeric:tabular-nums;color:var(--ad-t)}.ad-placar span{font-size:20px;color:var(--lapis)}
.ad-quad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.ad-quad .q{width:44px;height:44px;border-radius:10px;border:0;cursor:pointer;position:relative;font:600 15px var(--disp);font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0}
.ad-quad .q.ok{background:var(--certo-bg);color:var(--certo);box-shadow:inset 0 0 0 1.5px var(--certo)}
.ad-quad .q.er{background:var(--errado-bg);color:var(--errado);box-shadow:inset 0 0 0 1.5px var(--errado)}
.ad-quad .q.vz{background:color-mix(in srgb,var(--tinta) 8%,transparent);color:var(--lapis)}
.ad-quad .q.ajuda{box-shadow:inset 0 0 0 1.5px var(--aviso)}
.ad-quad .q.ok::after,.ad-quad .q.er::after{content:"";position:absolute;top:3px;right:3px;width:11px;height:11px;background:currentColor;-webkit-mask:var(--ad-ok-m) center/contain no-repeat;mask:var(--ad-ok-m) center/contain no-repeat}
.ad-quad .q.er::after{-webkit-mask-image:var(--ad-x-m);mask-image:var(--ad-x-m)}
.ad-leg{font-size:14px;color:var(--lapis);margin:-10px 0 20px}
.ad-leg i{display:inline-block;width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--aviso);vertical-align:-2px;margin-right:4px}
.ad-fatos{list-style:none;padding:0;margin:0 auto 24px;display:grid;gap:10px;text-align:left;max-width:520px}
.ad-fatos li{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--lapis)}
.ad-fatos li b{color:var(--tinta);font-variant-numeric:tabular-nums}
.ad-fatos svg{width:20px;height:20px;color:var(--ad-t);flex:none}
.ad-res-acoes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ad-res-acoes .btn{width:auto;margin:0!important;min-width:200px}
#v-revisao .ad-rev-capa{display:block!important}
#v-revisao .ad-rev-capa .btn{margin-top:16px}
.ad-ok-rev{display:flex;align-items:center;gap:8px;color:var(--certo)!important;margin-top:12px!important}
.ad-ok-rev svg{width:20px;height:20px}
#v-revisao h2.sec small,html.ad h2.sec small{color:var(--lapis);font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}
.ad-lista{display:flex;flex-direction:column}
.ad-lq{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);background:transparent;border-radius:0;padding:10px 6px;cursor:pointer;color:var(--tinta)}
.ad-lq:last-child{border-bottom:0}
.ad-lq .ic-tema{width:34px;height:34px;color:var(--ad-t);flex:none}
.ad-lq .t{flex:1;min-width:0}.ad-lq .t b{display:block;font:500 16px var(--disp)}.ad-lq .t small{color:var(--lapis);font-size:14px}
.ad-lq .x{font-size:14px;color:var(--lapis)}.ad-lq .x .cert{font-style:normal;color:var(--errado)}
.ad-lq > svg:last-child{width:16px;height:16px;color:var(--fraco)}

/* ---------- simulados: lista com afordancia e teclado ---------- */
@media (min-width:1100px){html.ad #v-simulado,html.ad #v-progresso,html.ad #v-revisao{max-width:1040px}}
.ad-simg{margin:20px 0 6px;font:600 14px var(--disp);letter-spacing:.02em;color:var(--fraco)}
.ad-simg:first-child{margin-top:0}
.ad-sim{display:grid;grid-template-columns:40px minmax(0,1fr) auto 20px;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);background:transparent;padding:12px 6px;cursor:pointer;color:var(--tinta);border-radius:0}
.ad-sim:last-child{border-bottom:0}
.ad-sim .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acento-sv);color:var(--ad-t)}
.ad-sim .ic svg{width:22px;height:22px}
.ad-sim b{display:block;font:600 16px var(--disp)}
.ad-sim small{display:block;font-size:14px;color:var(--lapis);margin-top:2px}
.ad-sim .m{font-size:14px;color:var(--lapis);white-space:nowrap;font-variant-numeric:tabular-nums}
.ad-sim > svg{width:16px;height:16px;color:var(--fraco)}
.ad-sim[aria-disabled="true"]{opacity:.5}
@media (max-width:600px){.ad-sim{grid-template-columns:40px minmax(0,1fr) 16px}.ad-sim .m{grid-column:2;grid-row:2}}

/* ---------- desempenho: so cor fora da meta, nunca veredito com 1 resposta ---------- */
.ad-desemp{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 32px}
.ad-dm{border:0;border-bottom:1px solid var(--linha);background:transparent;border-radius:0;padding:14px 4px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:var(--tinta)}
.ad-dm .top{display:flex;align-items:center;gap:12px}
.ad-dm .ic-tema{width:34px;height:34px;color:var(--ad-t);flex:none}
.ad-dm b{font:600 16px/1.3 var(--disp);flex:1;min-width:0}
.ad-dm .num{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--lapis)}
.ad-dm .num strong{font:600 20px var(--disp);color:var(--tinta);font-variant-numeric:tabular-nums}
.ad-dm .num strong.pouco{font:500 14px var(--disp);color:var(--lapis)}
.ad-dm .num strong.baixo{color:var(--aviso)}
.ad-dm .br{height:6px;border-radius:9px;background:color-mix(in srgb,var(--tinta) 10%,transparent);overflow:hidden}
.ad-dm .br i{display:block;height:100%;background:var(--ad-c);border-radius:9px}
.ad-dm .br.trac{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--tinta) 14%,transparent) 0 6px,transparent 6px 10px)}
html.ad #desempenho.painel{background:transparent;border:0;padding:0}
.ad-pad{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--linha)}
.ad-pad:last-child{border-bottom:0}
.ad-pad b{font:600 16px var(--disp)}
.ad-pad p{grid-column:1;margin:0;font-size:15px;color:var(--lapis);line-height:1.5}
.ad-pad span{grid-column:2;grid-row:1;font-size:14px;color:var(--lapis);white-space:nowrap;font-variant-numeric:tabular-nums}
details.ad-dados{margin-top:28px;border:0;border-top:1px solid var(--linha);border-radius:0;background:transparent;padding:16px 0 0}
details.ad-dados > summary{cursor:pointer;font:600 16px var(--disp);display:flex;align-items:center}
details.ad-dados > div{margin-top:12px}
details.ad-dados .painel .btn{width:auto;margin:6px 8px 0 0!important}
html.ad #v-progresso > h2.sec:last-of-type{display:none}

/* ---------- escrita de caderno: so o que o aluno copia (identidade) ---------- */
html.ad .formula,html.ad .form,html.ad #ad-painel .passo .conta,html.ad #ad-painel .resp,html.ad .figura{
  background-color:var(--papel-cad)!important;
  background-image:linear-gradient(var(--grade-suave) 1px,transparent 1px),linear-gradient(90deg,var(--grade-suave) 1px,transparent 1px)!important;
  background-size:22px 22px!important;background-position:-1px -1px!important;
  color:var(--tinta-cad)!important;border:1px solid var(--borda-cad)!important;border-radius:8px!important;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.14)!important}
html.ad .formula code,html.ad .form div{background:none!important;border:0!important;padding:0!important}
html.ad .formula code,html.ad .form div,html.ad #ad-painel .passo .conta:not(.bloco){font-family:var(--mao)!important;font-size:19px!important;line-height:1.55!important;color:var(--tinta-cad)!important;letter-spacing:.1px}
html.ad #ad-painel .passo .conta.bloco{font-family:var(--mono)!important;font-size:14px!important}
html.ad .formula{padding:10px 16px!important;display:flex;flex-direction:column;gap:4px}
html.ad .form{padding:10px 16px!important}
html.ad #ad-painel .passo .conta{padding:8px 14px!important}
html.ad #ad-painel .resp{font-family:var(--mao)!important;font-size:19px!important;font-weight:400!important;padding:12px 16px!important}
html.ad #ad-painel .resp .resp-mt{background:linear-gradient(transparent 58%,var(--marca-cad) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px}
html.ad .figura{padding:12px!important}
html.ad .figura svg{--fg:var(--tinta-cad);--acento:var(--caneta-verm);--aviso:#E0A33A;--ok:#4CC27A;color:var(--tinta-cad);filter:url(#ad-rabisco)}
html.ad[data-theme="light"] .figura svg{--aviso:#b45309;--ok:#1e7d3a}
html.ad .figura svg text{font-family:var(--mao)!important}
html.ad .figura figcaption{font-family:var(--mao);font-size:15px;color:var(--leg-cad)!important}
html.ad .form sup,html.ad .formula sup{font-size:.7em;line-height:0}

/* ---------- galeria "Imagens do tema" ---------- */
.ad-gal-wrap:empty{display:none}
.ad-gal-t{margin:18px 0 10px;font:600 16px var(--disp)}
.ad-gal-t small{color:var(--lapis);font-weight:500;margin-left:6px}
.ad-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ad-gi{border:0;background:var(--folha2);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--tinta)}
.ad-gi img{width:100%;height:96px;object-fit:contain;border-radius:8px}
.ad-gi.cad{background:#FBF7EA}
.ad-gi.cad img{filter:url(#ad-rabisco)}
.ad-gi span{font:500 13px/1.3 var(--disp);color:var(--lapis);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
#ad-amplia{position:fixed;inset:0;z-index:80;background:rgba(5,6,8,.82);display:grid;place-items:center;padding:24px}
#ad-amplia[hidden]{display:none}
.ad-amp-caixa{width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--folha);border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.ad-amp-topo{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--linha)}
.ad-amp-topo b{flex:1;font:600 15px var(--disp)}.ad-amp-topo span{color:var(--lapis);font-size:14px}
.ad-amp-topo button,.ad-amp-pe button{border:0;background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--tinta);border-radius:9px;width:36px;height:36px;cursor:pointer;font-size:18px}
.ad-amp-img{flex:1;min-height:0;max-height:calc(100vh - 170px);overflow:auto;padding:18px;background:var(--folha);display:grid;place-items:start center}
.ad-amp-img.cad{background:#FBF7EA}
.ad-amp-img.cad img{filter:url(#ad-rabisco)}
.ad-amp-img img{width:min(100%,900px);height:auto;max-height:none}
.ad-amp-pe{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--linha)}
.ad-amp-pe small{flex:1;text-align:center;color:var(--lapis);font-size:14px}

/* ---------- duas vozes: Instrument Sans na interface; a mao so no caderno; mono so em conta alinhada ---------- */
html.ad .print-pe,html.ad .print-lupa{font:600 13px var(--disp)!important;letter-spacing:.02em!important;text-transform:none!important}
html.ad .print-pe{color:#5F5B50!important}
html.ad .print-lupa{color:#3E3A31}
html.ad .fonte,html.ad .fonte a,html.ad details.ficha > summary{font-family:var(--disp)!important}
html.ad .fonte{font-size:15px;line-height:1.6}
html.ad .lupa-top b,html.ad #lupa-nivel,html.ad .lupa-pe,html.ad .print .carregando{font-family:var(--disp)!important;letter-spacing:0!important;text-transform:none!important}
html.ad .lupa-top b{font-size:14px;font-weight:600;color:var(--tinta)}

/* ---------- resolucao animada (mantida) ---------- */
html.ad .ad-play{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 14px;padding:6px;border:0;border-radius:12px;background:color-mix(in srgb,var(--tinta) 6%,transparent)}
html.ad .ad-play button{font:600 14px/1 var(--disp);color:var(--tinta);background:transparent;border:0;border-radius:9px;padding:8px 11px;cursor:pointer;min-width:36px}
html.ad .ad-play button.pri{background:var(--ad-c);color:var(--ad-ink);padding:8px 14px}
html.ad .ad-play .ad-pp{font:600 14px/1 var(--disp);font-variant-numeric:tabular-nums;color:var(--lapis);min-width:44px;text-align:center}
html.ad .ad-play [data-a="tudo"]{margin-left:auto}
html.ad .ad-play button{display:inline-flex;align-items:center;justify-content:center;gap:7px}
html.ad .ad-play button svg{width:16px;height:16px}
html.ad .ad-play button.pri svg{width:14px;height:14px}
html.ad .ad-play button:disabled{opacity:.38;cursor:default}
html.ad .print-lupa,html.ad .print-tp{display:inline-flex;align-items:center;gap:6px}
html.ad .print-tp{font:600 13px var(--disp)!important;letter-spacing:.02em!important;text-transform:none!important;color:#3E3A31;background:#F1EEE6;border:1px solid #DAD5C8;border-radius:999px;padding:3px 10px;cursor:pointer}
html.ad .print-tp svg{width:14px;height:14px}
html.ad #ad-painel .texto-toggle{gap:8px}
html.ad #ad-painel .texto-toggle svg{width:16px;height:16px}
html.ad .print-lupa svg{width:14px;height:14px}
#lupa button svg{width:18px;height:18px;margin:auto}
.ad-amp-topo button svg,.ad-amp-pe button svg{width:18px;height:18px;margin:auto}
.ad-ajuda svg{width:16px;height:16px}
html.ad .btn-pausa svg{width:15px;height:15px}
.ad-tela{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:0;border-radius:9px;background:var(--ad-c);color:var(--ad-ink);font:600 14px var(--disp);cursor:pointer;flex:none}
.ad-tela svg{width:17px;height:17px}
@media (max-width:820px){.ad-tela span{display:none}.ad-tela{padding:0 9px}}
/* ---------- tela cheia / modo foco: o print manda; menus, faixa e atalhos somem ---------- */
html.ad.ad-foco[data-v="questao"] #ad-temas,html.ad.ad-foco[data-v="simulado-q"] #ad-temas,html.ad.ad-foco #ad-baixo{display:none!important}
.ad-flut{position:fixed;right:16px;bottom:16px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none}
html.ad.ad-foco:not([data-v="questao"]):not([data-v="simulado-q"]) .ad-flut{display:inline-flex}
html.ad.ad-foco:not([data-v="questao"]):not([data-v="simulado-q"]) .ad-flut span{display:inline}
html.ad.ad-foco[data-v="questao"] .wrap,html.ad.ad-foco[data-v="simulado-q"] .wrap{max-width:none!important;padding-left:24px;padding-right:24px}
/* 30/10: fora da questao, a tela cheia fica igual a janela normal (mesma largura, temas no topo) */
html.ad.ad-foco:not([data-v="questao"]):not([data-v="simulado-q"]) .wrap{margin-left:auto;margin-right:auto}
html.ad.ad-foco #v-questao .nav2{margin-left:-24px;margin-right:-24px;padding:0 24px}
/* antes de responder a questao tampa ~70% da tela; o painel fica estreito. Depois, a resolucao alarga.
   A largura do print e' a mesma regra fora da tela cheia (--ad-pw, no JS): enche a coluna e so estreita se
   couber inteiro na altura util ainda legivel; senao as letras + Confirmar ficam grudadas no pe da tela. */
html.ad.ad-foco #q-corpo.ad-q{grid-template-columns:minmax(0,7fr) minmax(300px,3fr);gap:16px}
html.ad.ad-foco.ad-resp #q-corpo.ad-q{grid-template-columns:minmax(0,1.1fr) minmax(460px,1fr)}
html.ad.ad-foco:not(.ad-resp) #ad-painel .ad-abas button{padding:12px 9px 11px}
html.ad.ad-foco:not(.ad-resp) #ad-painel .ad-rel{display:none}
html.ad.ad-foco #q-corpo.ad-q > .entra2{padding-top:14px}
@media (max-width:900px){html.ad.ad-foco #q-corpo.ad-q,html.ad.ad-foco.ad-resp #q-corpo.ad-q{grid-template-columns:minmax(0,1fr)}}
html.ad .passo.ad-oculto{display:none!important}
html.ad .passo.ad-atual .nn{box-shadow:0 0 0 3px color-mix(in srgb,var(--ad-c) 35%,transparent)}
html.ad .ad-ln{display:block}
html.ad .ad-tr{display:inline;opacity:0}
html.ad .ad-tr.ad-escreve{opacity:1}
html.ad .ad-ch{display:inline;white-space:pre-wrap}
html.ad .ad-tr.ad-feito{opacity:1}
html.ad .ad-pos{opacity:0;transform:translateY(4px);transition:opacity .4s cubic-bezier(.4,0,.2,1),transform .4s cubic-bezier(.4,0,.2,1)}
html.ad .ad-pos.ad-feito{opacity:1;transform:none}
/* 30/10: a revelacao da escrita e a caneta sao animadas pelo materia.js (Web Animations, easing suave); aqui so a entrada do passo */
@media (prefers-reduced-motion:no-preference){
  html.ad .passo.ad-atual{animation:adEntra .38s cubic-bezier(.4,0,.2,1) both}
}
@keyframes adEntra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
html.ad .passo .conta{position:relative}
/* ponta da caneta (30/10, 2a rodada): um traco fino inclinado na cor da tinta, que anda letra por letra */
html.ad .ad-caneta{position:absolute;left:-1px;top:0;width:2.5px;border-radius:2px;pointer-events:none;opacity:0;z-index:2;transform-origin:50% 100%;
  background:linear-gradient(var(--tinta-cad),color-mix(in srgb,var(--tinta-cad) 55%,transparent));box-shadow:0 0 0 .5px color-mix(in srgb,var(--tinta-cad) 25%,transparent)}
/* marca-texto: faixa na metade de baixo da letra, varrida da esquerda para a direita (linha a linha em texto quebrado) */
html.ad .ad-mt{background-image:linear-gradient(transparent 54%,var(--marca-cad) 54%,var(--marca-cad) 92%,transparent 92%);background-repeat:no-repeat;background-size:0% 100%;-webkit-box-decoration-break:slice;box-decoration-break:slice}
html.ad .ad-mt.ad-mt-ok{background-size:100% 100%}
html.ad #ad-painel .passo .conta mark.ad-fim:not(.ad-mt){background:none}
html.ad #ad-painel .passo .conta mark.ad-fim.ad-mt{background-color:transparent;background-image:linear-gradient(transparent 54%,var(--marca-cad) 54%,var(--marca-cad) 92%,transparent 92%)}
html.ad .ad-tr{position:relative;z-index:1}
@keyframes adEscreve{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){html.ad .ad-tr,html.ad .ad-pos{opacity:1!important;animation:none!important;transform:none!important}}

/* ---------- hover so com mouse (nada preso depois do toque) ---------- */
@media (hover:hover) and (pointer:fine){
  .ad-filtros button:hover{color:var(--tinta);background:color-mix(in srgb,var(--tinta) 6%,transparent)}
  .ad-tema:hover{background:color-mix(in srgb,var(--tinta) 5%,transparent)}
  .ad-tema[aria-current="true"]:hover{background:var(--acento-sv)}
  .ad-tema:hover .ic-tema{transform:translateY(-2px) scale(1.05)}
  html.ad .btn:hover{filter:brightness(1.07)}
  html.ad .btn.sec:hover{background:color-mix(in srgb,var(--tinta) 11%,transparent);filter:none}
  html.ad .linha[style*="cursor"]:hover,html.ad #reforco .linha:hover,html.ad .sub:hover,html.ad .ad-lq:hover,html.ad .ad-sim:hover,html.ad .ad-dm:hover,.ad-bx button:hover,.ad-rel button:hover,html.ad .degrau:hover:not(.agora){background:color-mix(in srgb,var(--tinta) 5%,transparent)}
  html.ad .mod:not([open]) > summary:hover{background:color-mix(in srgb,var(--tinta) 5%,transparent)}
  html.ad .bolha:hover:not(.certo):not(.errado):not(.apaga):not(.sel){border-color:var(--borda2);background:color-mix(in srgb,var(--tinta) 9%,var(--folha2))}
  .ad-ant:hover,html.ad .btn-pausa:hover,.ad-orig:hover,html.ad #ad-painel .texto-toggle:hover,html.ad details.teoria-cx > summary:hover{background:color-mix(in srgb,var(--tinta) 12%,transparent)}
  html.ad .btn-pausa.pausado:hover{background:var(--ad-c)}
  html.ad #b-dica.b-pista:hover{color:var(--tinta);background:color-mix(in srgb,var(--tinta) 6%,transparent)}
  .ad-conf button:hover:not([aria-checked="true"]){color:var(--tinta)}
  .ad-abas button:hover{color:var(--tinta)}
  .ad-marca:hover{color:var(--tinta);background:color-mix(in srgb,var(--tinta) 7%,transparent)}
  html.ad .nav2 .volta:hover{background:color-mix(in srgb,var(--tinta) 7%,transparent)}
  .ad-quad .q:hover{transform:scale(1.1)}
  .ad-gi:hover{transform:translateY(-2px)}
  .ad-amp-topo button:hover,.ad-amp-pe button:hover,html.ad .ad-play button:not(.pri):hover{background:color-mix(in srgb,var(--tinta) 12%,transparent)}
  .ad-sim:hover > svg,.ad-lq:hover > svg:last-child,.ad-bx button:hover > svg:last-child{transform:translateX(3px);color:var(--tinta)}
}
.ad-tema,.ad-dm,.ad-bx button,.ad-rel button,html.ad .degrau,html.ad .sub,html.ad .btn,.ad-filtros button,.ad-abas button,.ad-ant,html.ad #b-dica,.ad-sim,.ad-lq,.ad-gi,.ad-quad .q,.ad-conf button{transition:transform .2s var(--curva),background-color .18s,border-color .18s,color .18s,opacity .2s,box-shadow .18s,filter .18s}
.ad-tema .ic-tema,.ad-sim > svg,.ad-lq > svg:last-child,.ad-bx button > svg:last-child{transition:transform .3s var(--curva),color .2s}
html.ad .btn:active,.ad-ant:active,.ad-filtros button:active,.ad-tema:active,.ad-sim:active,.ad-lq:active{transform:scale(.98)}

/* ---------- movimento: veredito como evento ---------- */
@media (prefers-reduced-motion:no-preference){
  html.ad .wrap > section:not([hidden]){animation:ad-sobe .35s var(--curva) both}
  html.ad #ad-painel .ad-aba:not([hidden]){animation:ad-aparece .2s ease both}
  html.ad #ad-painel .veredito{animation:ad-veredito .22s ease-out both}
  html.ad #ad-painel .resolucao,html.ad #ad-painel .dica-nivel,html.ad .ad-volta{animation:ad-sobe .35s var(--curva) both}
  html.ad .mod[open] > .corpo{animation:ad-sobe .28s var(--curva) both}
  .ad-desemp > *{animation:ad-sobe .4s var(--curva) both;animation-delay:calc(var(--i,0) * 25ms)}
  .ad-dm .br i,html.ad .prog i{transform-origin:left;animation:ad-cresce .8s .12s var(--curva) both}
  html.ad .bolha.certo{animation:ad-ok .24s var(--entra) both}
  html.ad .bolha.certo::after{animation:ad-risca .2s .08s ease-out both}
  html.ad .bolha.errado{animation:ad-treme .18s linear both}
  .ad-res{animation:ad-sobe .4s var(--curva) both}
  .ad-quad .q{animation:ad-sobe .2s var(--curva) both;animation-delay:calc(var(--i,0) * 40ms)}
  #ad-amplia:not([hidden]) .ad-amp-caixa{animation:ad-sobe .3s var(--curva) both}
  html.ad.ad-resp #q-corpo.ad-q > #ad-painel{animation:ad-painel .3s var(--padrao) both}
}
@keyframes ad-sobe{from{opacity:0;transform:translateY(10px)}}
@keyframes ad-aparece{from{opacity:0}}
@keyframes ad-cresce{from{transform:scaleX(0)}}
@keyframes ad-veredito{from{opacity:0;transform:translateY(8px)}}
@keyframes ad-ok{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes ad-risca{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ad-treme{0%{transform:translateX(0)}33%{transform:translateX(-3px)}66%{transform:translateX(3px)}100%{transform:translateX(0)}}
@keyframes ad-painel{from{opacity:.6}}
/* ==== fim design ==== */

/* ==========================================================================================
   2a rodada 29/10: pagina do modulo, areas de revisao, teoria em cartoes, figura do conteudo
   ========================================================================================== */
html.ad nav.bot em{display:none}   /* app avulso: sem glifo de teclado como icone */
html.ad svg.ic-pro{overflow:visible}
.ad-link{border:0;background:transparent;color:var(--lapis);font:500 16px var(--disp);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 4px}
.ad-mp-topo{margin:0 0 10px}
.ad-mp-volta,.ad-tp-volta{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--lapis);font:500 16px var(--disp);padding:8px 10px 8px 4px;border-radius:10px;cursor:pointer}
.ad-mp-volta svg,.ad-tp-volta svg{width:20px;height:20px}
html.ad .btn.ad-comecar{font:700 20px var(--disp);padding:16px 34px;min-height:60px;border-radius:14px;gap:10px}
html.ad .btn.ad-comecar svg{width:22px;height:22px}
.ad-mp-comp{margin:0;font-size:16px;color:var(--lapis);flex:1 1 260px}

/* ---------- grade de temas (Questoes) ---------- */
.ad-mods-sub{font-size:17px;color:var(--lapis);margin:0 0 16px}
.ad-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:6px 18px}
.ad-mc{display:grid;grid-template-columns:52px minmax(0,1fr) 20px;gap:16px;align-items:center;text-align:left;border:0;background:transparent;color:var(--tinta);padding:16px 12px;border-radius:16px;cursor:pointer;border-bottom:1px solid var(--linha)}
.ad-mc .ic-tema{width:52px;height:52px;color:var(--ad-t)}
.ad-mc .t b{display:block;font:600 19px/1.25 var(--disp)}
.ad-mc .t small{display:block;font-size:15px;color:var(--lapis);margin-top:2px}
.ad-mc .t small.n{font-size:14px;margin-top:4px}
.ad-mc .br,.ad-enc .br,.ad-ar-m .br,.ad-fx .br{display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--tinta) 9%,transparent);overflow:hidden;margin-top:8px}
.ad-mc .br i,.ad-enc .br i,.ad-ar-m .br i,.ad-fx .br i{display:block;height:100%;background:var(--ad-c);border-radius:3px}
.ad-mc > svg:last-child,.ad-ar-m > svg:last-child{width:20px;height:20px;color:var(--fraco)}

/* ---------- pagina do modulo ---------- */
html.ad .capa.ad-mp-capa{padding:28px 30px}
.ad-mp-cab,.ad-tp-cab{display:flex;align-items:center;gap:22px}
.ad-mp-ic{width:84px;height:84px;flex:none;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--ad-c) 14%,var(--folha));color:var(--ad-t)}
.ad-mp-ic svg,.ad-mp-ic .ic-tema{width:56px;height:56px}
.ad-mp-rot{margin:0 0 2px!important;font-size:15px!important;color:var(--lapis)}
html.ad .ad-mp-capa h1,.ad-tp-cab h1{font:700 36px/1.12 var(--disp);letter-spacing:-.5px;margin:0}
.ad-mp-cab .ad-stat,.ad-tp-cab .ad-stat{margin-top:8px}
.ad-fx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:24px 0 0}
.ad-fx-i{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:8px}
.ad-fx-i .r{font:600 15px var(--disp)}
.ad-fx-i .n{font-size:14px;color:var(--lapis);font-variant-numeric:tabular-nums}
.ad-fx-i .br{grid-column:1 / -1;height:8px;border-radius:4px;margin-top:8px}
.ad-mp-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:24px}
.ad-mp-acoes #ad-mp-teo{margin-left:auto}
.ad-mp-h{margin-top:30px!important}
.ad-bloco > .ad-mp-h{margin-top:0!important}
.ad-enc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));column-gap:28px}
.ad-enc li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--linha)}
.ad-enc li > .ic-tema{width:44px;height:44px;color:var(--ad-t)}
.ad-enc .t b{display:block;font:600 18px/1.3 var(--disp)}
.ad-enc .t > span{display:block;font-size:16px;line-height:1.45;color:var(--lapis);margin-top:3px}
.ad-enc .p{width:76px;text-align:right;font-size:15px;color:var(--lapis)}
.ad-enc .p .br{margin-top:6px}
.ad-enc-esc{display:none;grid-column:2 / -1;justify-self:start;align-items:center;gap:6px;border:0;background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--tinta);font:600 15px var(--disp);padding:8px 14px;border-radius:10px;cursor:pointer}
.ad-enc-esc svg{width:16px;height:16px}
.ad-enc.porc .ad-enc-esc{display:inline-flex}
.ad-mp-pc{margin:12px 0 0;text-align:center}
.ad-mp-viz{display:flex;justify-content:space-between;gap:16px;margin:28px 0 0;flex-wrap:wrap}
.ad-mp-viz button{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--tinta);padding:14px 16px;border-radius:14px;cursor:pointer;text-align:left}
.ad-mp-viz button.d{text-align:right;margin-left:auto}
.ad-mp-viz small{display:block;font-size:14px;color:var(--lapis)}
.ad-mp-viz b{display:block;font:600 18px var(--disp)}
.ad-mp-viz svg{width:22px;height:22px;color:var(--ad-t)}
@media (max-width:700px){

  .ad-mp-ic{width:60px;height:60px;border-radius:16px}.ad-mp-ic svg,.ad-mp-ic .ic-tema{width:40px;height:40px}

  .ad-fx{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  html.ad .btn.ad-comecar{width:100%}
  .ad-mp-acoes #ad-mp-teo{margin-left:0;width:100%}

  .ad-enc li > .ic-tema{width:36px;height:36px}
  .ad-enc .p{grid-column:2;width:auto;text-align:left;display:flex;align-items:center;gap:10px}
  .ad-enc .p .br{margin:0;flex:1;max-width:160px}

/* ---------- areas de revisao (inicio da materia) ---------- */
#ad-areas{margin-top:30px}
.ad-ar-abas{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-bottom:18px;border-bottom:1px solid var(--linha)}
.ad-ar-abas button{flex:none;display:inline-flex;align-items:center;gap:10px;border:0;background:color-mix(in srgb,var(--tinta) 5%,transparent);color:var(--tinta);font:500 16px var(--disp);padding:10px 18px 10px 12px;cursor:pointer;border-radius:999px;min-height:48px}
.ad-ar-abas button svg{width:28px;height:28px;color:var(--ad-t)}
.ad-ar-abas button[aria-selected="true"]{background:var(--ad-c);color:var(--ad-ink);font-weight:600}
.ad-ar-abas button[aria-selected="true"] svg{color:var(--ad-ink)}
@media (max-width:700px){.ad-ar-abas{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px 16px}.ad-ar-abas::-webkit-scrollbar{display:none}}
.ad-ar-painel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;padding:26px 4px 6px}
.ad-ar-txt h3{font:700 30px/1.15 var(--disp);letter-spacing:-.4px;margin:0 0 8px}
.ad-ar-res{font-size:18px;line-height:1.55;margin:0;color:var(--tinta)}
.ad-ar-top{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.ad-ar-top li{font:500 15px var(--disp);padding:7px 14px;border-radius:999px;background:var(--acento-sv);color:var(--tinta)}
.ad-ar-go{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:20px}
.ad-ar-mods h4{margin:0 0 4px;font:600 16px var(--disp);color:var(--lapis)}
.ad-ar-m{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 20px;gap:14px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--linha);background:transparent;color:var(--tinta);padding:14px 8px;cursor:pointer;border-radius:12px 12px 0 0}
.ad-ar-m .ic-tema{width:40px;height:40px;color:var(--ad-t)}
.ad-ar-m .t b{display:block;font:600 18px var(--disp)}
.ad-ar-m .t small{display:block;font-size:14px;color:var(--lapis);margin-top:4px}
.ad-ar-m .br{max-width:260px}
@media (max-width:900px){.ad-ar-painel{grid-template-columns:minmax(0,1fr);gap:22px}}
@media (max-width:700px){.ad-ar-txt h3{font-size:25px}.ad-ar-go .btn.ad-comecar{width:100%}}

/* ---------- cartoes de teoria ---------- */
.ad-cartao{background:var(--folha);border:1px solid var(--linha);border-radius:20px;padding:26px 28px 28px;box-shadow:var(--sombra-c);display:flex;flex-direction:column;gap:20px;min-width:0}
.ad-cartao header{display:flex;align-items:center;gap:16px}
.ad-c-ic{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--ad-c) 14%,var(--folha));color:var(--ad-t)}
.ad-c-ic svg{width:36px;height:36px}
.ad-cartao h3{margin:0;font:700 26px/1.2 var(--disp);letter-spacing:-.3px;color:var(--tinta)}
.ad-cartao header small{display:block;font-size:15px;color:var(--lapis);margin-top:3px}
.ad-cartao section{margin:0}
.ad-cartao h4{margin:0 0 6px;font:700 15px/1.3 var(--disp);color:var(--ad-t);letter-spacing:.01em}
.ad-cartao p{margin:0;font-size:18px;line-height:1.6;color:var(--tinta);max-width:72ch}
.ad-cartao section.x{background:var(--acento-sv);border-radius:14px;padding:16px 20px}
.ad-dest{color:var(--ad-t);font-weight:700;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--ad-c) 26%,transparent) 62%);padding:0 2px;border-radius:2px}
.ad-folha{background-color:var(--papel-cad);background-image:linear-gradient(var(--grade-suave) 1px,transparent 1px),linear-gradient(90deg,var(--grade-suave) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;
  border:1px solid var(--borda-cad);border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.10);padding:12px 20px;font-family:var(--mao);font-size:23px;line-height:1.55;color:var(--tinta-cad);overflow-x:auto}

.ad-cartao section.c > svg{width:26px;height:26px;color:var(--aviso);flex:none;margin-top:1px}
.ad-cartao section.c h4{color:var(--aviso)}

.ad-cartao.compacto{padding:18px 18px 20px;border-radius:16px;gap:16px;box-shadow:none}
.ad-cartao.compacto h3{font-size:21px}

.ad-cartao.compacto .ad-c-ic{width:44px;height:44px;border-radius:12px}.ad-cartao.compacto .ad-c-ic svg{width:28px;height:28px}
.ad-cartao.compacto section.x,.ad-cartao.compacto section.c{padding:13px 15px}

@media (max-width:700px){.ad-cartao{padding:20px 18px 22px}.ad-cartao h3{font-size:23px}.ad-cartao p{font-size:17px}.ad-folha{font-size:21px;padding:10px 14px}}

/* aba Teoria da questao */
.ad-teo-rot{display:flex;align-items:center;gap:10px;margin:0 0 12px!important;font-size:16px!important;color:var(--lapis)}
.ad-teo-rot svg,.ad-teo-rot .ic-tema{width:30px;height:30px;color:var(--ad-t);flex:none}
.ad-teo-rot b{color:var(--tinta)}
html.ad .btn.ad-teo-tudo{width:100%;margin:16px 0 4px;font-size:16px}
html.ad .btn.ad-teo-tudo svg{width:20px;height:20px}
details.ad-teo-mais,details.ad-teo-velho{margin-top:14px;border-top:1px solid var(--linha);padding-top:4px}
details.ad-teo-mais > summary,details.ad-teo-velho > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font:600 16px var(--disp);color:var(--tinta);padding:12px 2px}
details.ad-teo-mais > summary::-webkit-details-marker,details.ad-teo-velho > summary::-webkit-details-marker{display:none}
details.ad-teo-mais > summary::before,details.ad-teo-velho > summary::before{content:"";width:16px;height:16px;flex:none;background:currentColor;-webkit-mask:var(--ad-chev) center/contain no-repeat;mask:var(--ad-chev) center/contain no-repeat;transition:transform .2s}
details[open].ad-teo-mais > summary::before,details[open].ad-teo-velho > summary::before{transform:rotate(90deg)}
details.ad-teo-mais > summary small{color:var(--lapis);font-weight:500}
details.ad-teo-velho p{font-size:17px;line-height:1.6;margin:0 0 12px}
details.ad-teo-velho .form{margin:0 0 12px}

/* ---------- teoria do modulo ---------- */
.ad-tp-cab{margin:4px 0 18px;flex-wrap:wrap}
.ad-tp-cab > div{flex:1 1 360px;min-width:0}
.ad-tp-nav{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;gap:6px;scrollbar-width:none;padding:10px 2px;margin:0 -2px 8px;
  background:var(--papel);border-bottom:1px solid var(--linha)}
.ad-tp-nav::-webkit-scrollbar{display:none}
.ad-tp-nav button{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:color-mix(in srgb,var(--tinta) 6%,transparent);color:var(--tinta);font:500 15px var(--disp);padding:9px 14px 9px 10px;border-radius:12px;cursor:pointer}
.ad-tp-nav button svg{width:24px;height:24px;color:var(--ad-t)}
.ad-tp-nav button[aria-current="true"]{background:var(--acento-sv);box-shadow:var(--anel-sel);font-weight:600}
.ad-tp-g{margin:26px 0 10px;scroll-margin-top:150px}
.ad-tp-g > h2{display:flex;align-items:center;gap:14px;margin:0 0 14px;font:700 25px/1.2 var(--disp);letter-spacing:-.3px}
.ad-tp-g > h2 svg{width:42px;height:42px;color:var(--ad-t);flex:none}
.ad-tp-g > h2 small{font:500 15px var(--disp);color:var(--lapis);margin-left:4px}
.ad-tp-cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr));gap:20px;align-items:start}
.ad-tp-cartoes .ad-cartao + .ad-cartao{margin-top:0}
#v-teoria details.ad-teo-velho{margin-top:30px}
@media (max-width:700px){.ad-tp-nav{flex-wrap:nowrap;overflow-x:auto}.ad-tp-g > h2{font-size:21px}.ad-tp-g > h2 svg{width:34px;height:34px}#ad-tp-comecar{width:100%}}

/* ---------- figura do conteudo (resolucao): sempre em papel branco ---------- */
.ad-fig{margin:0 0 20px}
.ad-fig figcaption{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px;font-size:15px;color:var(--lapis)}
.ad-fig figcaption b{font:700 15px var(--disp);color:var(--ad-t)}
.ad-fig-img{position:relative;display:block;width:100%;border:1px solid #E2E2DC;background:#FFFFFF;border-radius:14px;padding:12px;cursor:zoom-in}
.ad-fig-img img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain}
.ad-fig-img.cad{background:#FBF7EA}
.ad-fig-img.cad img{filter:url(#ad-rabisco)}
.ad-fig-amp{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--tinta);border:0;border-radius:999px;padding:6px 13px;font:600 14px var(--disp);cursor:pointer}
.ad-fig-amp svg{width:16px;height:16px}
.ad-fig-t{margin:8px 0 0!important;font-size:15px!important;color:var(--lapis)!important;line-height:1.45!important}
html.ad[data-theme="dark"] .ad-fig-img{border-color:#3A3D44}
/* galeria e imagem ampliada: papel branco nos dois temas */
.ad-gi{background:#FFFFFF;border:1px solid #E2E2DC}
.ad-gi span{color:#3F424A}
html.ad[data-theme="dark"] .ad-gi{border-color:#3A3D44}
.ad-gi img{height:110px}
.ad-amp-img{background:#FFFFFF}
.ad-gal-t{font-size:17px}
.ad-gi span{font-size:14px}

/* titulo da escada com o icone do conteudo */
html.ad #e-tit{display:flex;align-items:center;gap:14px}
html.ad #e-tit svg.ad-et-ic{width:44px;height:44px;color:var(--ad-t);flex:none}

@media (hover:hover) and (pointer:fine){
  .ad-mc:hover,.ad-ar-m:hover,.ad-mp-viz button:hover{background:color-mix(in srgb,var(--ad-c) 8%,transparent)}
  .ad-mc:hover > svg:last-child,.ad-ar-m:hover > svg:last-child{color:var(--ad-t);transform:translateX(3px)}
  .ad-ar-abas button[aria-selected="false"]:hover{background:color-mix(in srgb,var(--tinta) 10%,transparent)}
  .ad-mp-volta:hover,.ad-tp-volta:hover{color:var(--tinta);background:color-mix(in srgb,var(--tinta) 5%,transparent)}
  .ad-tp-nav button:hover,.ad-enc-esc:hover{background:color-mix(in srgb,var(--tinta) 11%,transparent)}
  .ad-fig-img:hover{border-color:var(--ad-c)}
  .ad-link:hover{color:var(--tinta)}
}
@media (prefers-reduced-motion:no-preference){
  #v-modulo:not([hidden]),#v-teoria:not([hidden]),.ad-ar-painel{animation:ad-sobe .3s var(--curva) both}
  .ad-mc > svg:last-child,.ad-ar-m > svg:last-child{transition:transform .2s var(--curva),color .2s}
}

html.ad #modulos{display:block!important;grid-template-columns:none!important}
html.ad #tit-modulos{font:700 28px/1.2 var(--disp)!important;letter-spacing:-.3px;margin:0 0 6px!important}
.ad-cartao sup{font-size:.7em;line-height:0}
@media (max-width:700px){.ad-fx-i .n{grid-column:1 / -1;grid-row:2}.ad-fx-i .br{grid-row:3}}
/* figura sempre em papel branco, inclusive as de estilo caderno (pedido do dono, 29/10) */
.ad-gi.cad,.ad-amp-img.cad,.ad-fig-img.cad{background:#FFFFFF}
/* navegacao da teoria: nomes longos encurtam (nome inteiro no title) para caber em ate 2 linhas */
.ad-tp-nav button span{max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html.ad .btn.ad-esc-teo{margin:4px 0 18px}html.ad .btn.ad-esc-teo svg{width:20px;height:20px}

/* ---------- revisao final 29/10: acabamento (P3) ---------- */
/* resultado do simulado: sem o " ·" solto depois do nome da materia */
html.ad[data-v="resultado"] .ad-barq .n::after{content:none}
/* listas com nome de conteudo em minuscula ("forcas intermoleculares...") comecam em maiuscula */
html.ad .linha .nm{display:inline-block}
html.ad .linha .nm::first-letter{text-transform:uppercase}
/* dentro da pagina principal, fora da tela cheia, o botao "Tela cheia" fica so no topo dela (um so) */
html.ad.emshell:not(.ad-foco) #v-questao .nav2 .ad-tela{display:none}
/* cronometro pausado: a questao some atras de um veu ate retomar */
html.ad:has(#q-pausa.pausado) #q-corpo > .entra2,html.ad:has(#q-pausa.pausado) #ad-painel{filter:blur(14px);pointer-events:none;user-select:none}
/* figura com letra pequena: o botao de ampliar ganha destaque (so da para ler ampliada) */
.ad-fig.ad-fig-ler .ad-fig-amp{background:var(--ad-c);color:var(--ad-ink)}

/* ==================== FLASHCARDS (30/10) ==================== */
/* telas de cartao: sem cabecalho nem faixa de temas, como na questao */
html.ad[data-v="flash"] #ad-cab,html.ad[data-v="flash"] #ad-temas,html.ad[data-v="resultado-fl"] #ad-cab,html.ad[data-v="resultado-fl"] #ad-temas{display:none}
/* abas da Revisao: Questoes | Flashcards (controle segmentado) */
.ad-rev-abas{display:inline-flex;gap:4px;padding:4px;margin:0 0 18px;border-radius:14px;background:color-mix(in srgb,var(--tinta) 6%,transparent)}
.ad-rev-abas button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--lapis);font:600 16px var(--disp);padding:10px 18px 10px 14px;border-radius:11px;cursor:pointer;min-height:44px}
.ad-rev-abas button svg{width:20px;height:20px}
.ad-rev-abas button[aria-selected="true"]{background:var(--folha);color:var(--tinta);box-shadow:0 1px 2px rgba(21,25,51,.08),var(--anel-sel)}
.ad-rev-abas button[aria-selected="true"] svg{color:var(--ad-t)}
.ad-rev-abas small{font:600 13px var(--disp);min-width:22px;height:22px;padding:0 7px;border-radius:11px;display:inline-grid;place-items:center;background:var(--ad-c);color:var(--ad-ink)}
/* capa dos flashcards */
#v-revisao .ad-fl-capa{display:grid!important;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t n" "g g";gap:6px 40px;align-items:start}
.ad-fl-ct{grid-area:t}.ad-fl-ct p{max-width:620px;line-height:1.5}
.ad-fl-nums{grid-area:n;display:flex;gap:28px;margin-top:4px}
.ad-fl-nums div{display:flex;flex-direction:column;min-width:76px}
.ad-fl-nums b{font:700 36px/1.05 var(--disp);color:var(--tinta);letter-spacing:-.5px}
.ad-fl-nums div:first-child b{color:var(--ad-t)}
.ad-fl-nums span{font-size:15px;color:var(--lapis);margin-top:4px}
.ad-fl-go{grid-area:g;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:18px}
#v-revisao .ad-fl-go .btn{margin-top:0}
#v-revisao .ad-fl-capa .ad-ok-rev{grid-area:g;font-size:17px}
/* filtros: areas em pilulas, temas em lista */
.ad-fl-areas{border-bottom:0;padding-bottom:4px}
.ad-fl-areas button svg{width:24px;height:24px}
.ad-fl-areas button[aria-pressed="true"]{background:var(--ad-c);color:var(--ad-ink);font-weight:600}
.ad-fl-areas button[aria-pressed="true"] svg{color:var(--ad-ink)}
.ad-fl-m{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--linha);background:transparent;color:var(--tinta);padding:12px 10px;cursor:pointer;border-radius:0}
.ad-fl-m:last-child{border-bottom:0}
.ad-fl-m > svg,.ad-fl-m > .ic-tema{width:34px;height:34px;color:var(--ad-t)}
.ad-fl-m > svg.ic-ui{width:24px;height:24px;justify-self:center}
.ad-fl-m .t b{display:block;font:600 17px var(--disp)}
.ad-fl-m .t small{display:block;color:var(--lapis);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.ad-fl-m .t small em{font-style:normal;color:var(--ad-t);font-weight:600}
.ad-fl-m .br{display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--tinta) 9%,transparent);overflow:hidden;margin-top:8px;max-width:420px}
.ad-fl-m .br i{display:block;height:100%;background:var(--ad-c);border-radius:3px}
.ad-fl-m[aria-pressed="true"]{background:var(--acento-sv);box-shadow:var(--anel-sel);border-radius:12px;border-bottom-color:transparent}
/* sessao: barra fina no topo */
#v-flash{max-width:920px;margin:0 auto}
.ad-fl-barra{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;min-height:52px;margin:0 0 14px;background:color-mix(in srgb,var(--papel) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ad-fl-barra .volta{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--tinta);font:600 15px var(--disp);padding:8px 12px 8px 4px;border-radius:10px;cursor:pointer}
.ad-fl-barra .volta svg{width:18px;height:18px}
.ad-fl-barra .t{font:500 15px var(--disp);color:var(--lapis);white-space:nowrap}
.ad-fl-barra .t b{color:var(--tinta)}
.ad-fl-barra .p{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--tinta) 9%,transparent);overflow:hidden}
.ad-fl-barra .p i{display:block;height:100%;background:var(--ad-c);border-radius:3px;transition:width .3s var(--padrao)}
/* o cartao */
.ad-fl-card{background:var(--folha);border:1px solid var(--linha);border-radius:20px;padding:30px 40px 34px;box-shadow:var(--sombra-c)}
.ad-fl-meta{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:12px;margin:0 0 18px;font-size:15px;color:var(--lapis)}
.ad-fl-meta > svg{width:32px;height:32px;color:var(--ad-t)}
.ad-fl-meta .nm{min-width:0;line-height:1.35}
.ad-fl-meta .nm b{display:block;font:600 15px var(--disp);color:var(--tinta)}
.ad-fl-meta .nm span{display:block;color:var(--lapis);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-fl-meta .tgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ad-fl-meta .tg{font:600 13px var(--disp);padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--tinta) 7%,transparent);color:var(--lapis);white-space:nowrap}
.ad-fl-meta .tg.nv{background:var(--acento-sv);color:var(--ad-t)}
.ad-fl-meta .tg.er{background:var(--errado-bg);color:var(--errado)}
.ad-fl-frente{font:600 30px/1.3 var(--disp);letter-spacing:-.3px;color:var(--tinta);margin:0 0 26px;text-wrap:pretty}
.ad-fl-lab{display:flex;align-items:center;gap:8px;font:600 15px var(--disp);color:var(--lapis);margin:0 0 8px}
.ad-fl-lab svg{width:18px;height:18px;color:var(--ad-t)}
#ad-fl-resp{display:block;width:100%;box-sizing:border-box;min-height:118px;resize:vertical;font:400 19px/1.5 var(--disp);color:var(--tinta);background:var(--folha);border:1.5px solid var(--borda2);border-radius:14px;padding:14px 16px;outline:none;transition:border-color .15s,box-shadow .15s}
#ad-fl-resp::placeholder{color:var(--fraco)}
#ad-fl-resp:focus{border-color:var(--ad-c);box-shadow:0 0 0 3px color-mix(in srgb,var(--ad-c) 20%,transparent)}
#ad-fl-resp[readonly]{background:var(--folha2);color:var(--lapis)}
#ad-fl-resp.ad-fl-vazio{border-color:var(--aviso)}
.ad-fl-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:16px}
.ad-fl-acoes[hidden]{display:none}
.ad-fl-acoes .btn{min-height:52px}
html.ad .ad-fl-acoes #ad-fl-corr{font-size:18px;padding:14px 30px}
.ad-fl-dica{margin-left:auto;font-size:14px;color:var(--fraco)}
@media (pointer:coarse){.ad-fl-dica,.ad-fl-tec{display:none!important}}
/* esperando a IA */
.ad-fl-esp{display:flex;align-items:center;flex-wrap:wrap;gap:12px 14px;margin-top:20px;padding:16px 18px;border-radius:14px;background:color-mix(in srgb,var(--tinta) 5%,transparent);font:500 17px var(--disp);color:var(--tinta)}
.ad-fl-esp .btn{margin-left:auto;padding:9px 16px;font-size:15px}
.ad-fl-pulso{width:12px;height:12px;border-radius:50%;background:var(--ad-c);flex:none}
@media (prefers-reduced-motion:no-preference){.ad-fl-pulso{animation:adFlPulso 1s var(--padrao) infinite alternate}}
@keyframes adFlPulso{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
/* veredito */
.ad-fl-aviso{display:flex;gap:10px;align-items:flex-start;margin:20px 0 0;padding:12px 14px;border-radius:12px;background:var(--aviso-bg);color:var(--tinta);font-size:15px;line-height:1.45}
.ad-fl-aviso svg{width:20px;height:20px;color:var(--aviso);flex:none;margin-top:1px}
.ad-fl-ver{margin-top:20px;padding:18px 20px;border-radius:14px;background:var(--errado-bg)}
.ad-fl-ver.certo{background:var(--certo-bg)}.ad-fl-ver.quase{background:var(--aviso-bg)}
.ad-fl-ver.nao{background:color-mix(in srgb,var(--tinta) 5%,transparent)}
.ad-fl-ver .cab{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0}
.ad-fl-ver .cab svg{width:28px;height:28px;color:var(--errado);flex:none}
.ad-fl-ver.certo .cab svg{color:var(--certo)}.ad-fl-ver.quase .cab svg{color:var(--aviso)}.ad-fl-ver.nao .cab svg{color:var(--lapis)}
.ad-fl-ver .cab b{font:700 23px var(--disp);color:var(--errado)}
.ad-fl-ver.certo .cab b{color:var(--certo)}.ad-fl-ver.quase .cab b{color:var(--aviso)}.ad-fl-ver.nao .cab b{color:var(--tinta)}
.ad-fl-ver .cab small{margin-left:auto;font-size:14px;color:var(--lapis)}
.ad-fl-ver .com{margin:8px 0 0;font-size:18px;line-height:1.5;color:var(--tinta)}
@media (prefers-reduced-motion:no-preference){.ad-fl-ver{animation:adFlEntra .22s var(--entra)}}
@keyframes adFlEntra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ad-fl-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}
.ad-fl-cmp h5,.ad-fl-falta h5{margin:0 0 6px;font:600 14px var(--disp);color:var(--lapis)}
.ad-fl-cmp p{margin:0;font-size:18px;line-height:1.55;color:var(--tinta);white-space:pre-wrap;overflow-wrap:anywhere}
.ad-fl-cmp .sua{padding:14px 16px;border-radius:12px;border:1px solid var(--linha)}
.ad-fl-cmp .mod{padding:14px 16px;border-radius:12px;background:var(--acento-sv)}
.ad-fl-falta{margin-top:16px}
.ad-fl-falta ul{margin:0;padding-left:22px;font-size:17px;line-height:1.5}
.ad-fl-cuid{margin:14px 0 0;padding:12px 16px;border-radius:12px;background:var(--aviso-bg);font-size:16px;line-height:1.5;color:var(--tinta)}
.ad-fl-cuid b{display:block;font:600 14px var(--disp);color:var(--aviso);margin-bottom:2px}

.ad-fl-nota{margin-top:22px;padding-top:18px;border-top:1px solid var(--linha)}
.ad-fl-nota .pq{margin:0 0 10px;font-size:16px;color:var(--lapis);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.ad-fl-tec{margin-left:auto;font-size:14px;color:var(--fraco)}
.ad-fl-bts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ad-fl-b{--k:var(--errado);--kb:var(--errado-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:70px;border:0;border-radius:14px;cursor:pointer;background:color-mix(in srgb,var(--tinta) 5%,transparent);color:var(--tinta);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--k) 45%,transparent);transition:transform .15s var(--curva),background-color .15s}
.ad-fl-b.q{--k:var(--aviso);--kb:var(--aviso-bg)}.ad-fl-b.a{--k:var(--certo);--kb:var(--certo-bg)}
.ad-fl-b b{font:700 19px var(--disp);color:var(--k)}
.ad-fl-b small{font-size:14px;color:var(--lapis)}
.ad-fl-b.sug{background:var(--kb);box-shadow:inset 0 0 0 2.5px var(--k)}
.ad-fl-b:focus-visible{outline:2px solid var(--k);outline-offset:3px}
@media (hover:hover) and (pointer:fine){.ad-fl-b:hover{background:var(--kb)}.ad-fl-m:hover{background:color-mix(in srgb,var(--tinta) 4%,transparent)}.ad-fl-m[aria-pressed="true"]:hover{background:var(--acento-sv)}.ad-rev-abas button:not([aria-selected="true"]):hover{color:var(--tinta);background:color-mix(in srgb,var(--tinta) 5%,transparent)}.ad-fl-barra .volta:hover{background:color-mix(in srgb,var(--tinta) 7%,transparent)}}
@media (prefers-reduced-motion:no-preference){.ad-fl-b:active{transform:scale(.97)}}
/* resultado */
.ad-fl-fim .ad-res-n{font:600 30px var(--disp);margin:6px 0 18px;color:var(--tinta)}
.ad-fl-fim .ad-res-n b{color:var(--ad-t)}
.ad-quad .q.qs{background:var(--aviso-bg);color:var(--aviso);box-shadow:inset 0 0 0 1.5px var(--aviso)}
.ad-fl-fim .ad-quad .q{cursor:default}
/* celular */
@media (max-width:700px){
  .ad-rev-abas{display:flex}.ad-rev-abas button{flex:1;justify-content:center;padding:10px 8px}
  #v-revisao .ad-fl-capa{grid-template-columns:minmax(0,1fr);grid-template-areas:"t" "n" "g";gap:14px}
  .ad-fl-nums{gap:18px}.ad-fl-nums b{font-size:30px}.ad-fl-nums div{min-width:0}
  .ad-fl-go .btn.ad-comecar{width:100%}
  .ad-fl-card{padding:20px 18px 22px;border-radius:16px}

}

/* ==== 3a rodada (29/10): icones realistas, ladrilho dos conteudos, blocos e destaque do principal ====
   Pedido do dono: meio-termo. Cada secao num cartao branco (borda fina, 16 px); o que fica dentro dele
   (pilulas, chips, listas) continua sem caixa propria. Fundo um tom mais escuro (#F1F1EE) para o branco destacar. */

/* -- icone de MODULO: ilustracao realista (<img>), sem cor de traco -- */
html.ad img.ic-tema{display:block;flex:none;object-fit:contain;-webkit-user-drag:none;user-select:none}
.ad-tema .ad-ic{width:58px;height:58px}
.ad-tema .ic-tema{width:44px;height:44px}
.ad-tema .ad-ic:has(.ic-real)::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--folha);z-index:-1}
.ad-tema .ad-ic{isolation:isolate}
#ad-temas .ad-seta{top:50px}
#ad-temas .ad-cred{margin:2px 10px 0;text-align:right;font-size:11.5px;color:var(--fraco);opacity:.85}
html.ad[data-v="questao"] .ad-cred,html.ad[data-v="simulado-q"] .ad-cred{display:none}
html.ad #e-tit .ad-et-ic{width:44px;height:44px;flex:none}
.ad-mc .ic-real{width:52px;height:52px}
.ad-dm .ic-real{width:40px;height:40px}
.ad-ar-m .ic-real{width:40px;height:40px;transform:scale(1.1)}
.ad-fl-m > .ic-real{width:38px;height:38px}
.ad-mp-ic:has(.ic-real){background:var(--folha);box-shadow:inset 0 0 0 1px var(--linha)}
.ad-mp-ic .ic-real{width:64px;height:64px}

/* -- icone de CONTEUDO (reserva): traco num ladrilho. Desde 30/10 o conteudo usa o realista (img.ic-sub, sem ladrilho) -- */
html.ad svg.ic-sub{box-sizing:border-box;border-radius:30%;color:var(--ad-t);overflow:visible;
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%),
    linear-gradient(180deg,color-mix(in srgb,var(--ad-c) 7%,#fff),color-mix(in srgb,var(--ad-c) 19%,#fff));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ad-c) 16%,transparent),0 1px 1.5px color-mix(in srgb,var(--ad-c) 20%,transparent),0 3px 6px -3px rgba(20,24,40,.16)}
html.ad[data-theme="dark"] svg.ic-sub{
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.07),rgba(255,255,255,0) 70%),
    linear-gradient(180deg,color-mix(in srgb,var(--ad-c) 12%,var(--folha2)),color-mix(in srgb,var(--ad-c) 24%,var(--folha2)));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ad-c) 22%,transparent),0 3px 6px -3px rgba(0,0,0,.5)}
.ad-ar-abas button[aria-selected="true"] svg.ic-sub,.ad-ar-abas button[aria-pressed="true"] svg.ic-sub{color:var(--ad-t);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15)}
html.ad[data-theme="dark"] .ad-ar-abas button[aria-selected="true"] svg.ic-sub,html.ad[data-theme="dark"] .ad-ar-abas button[aria-pressed="true"] svg.ic-sub{background:var(--folha);color:var(--ad-t)}
.ad-ar-abas button .ic-sub{width:32px;height:32px}
.ad-enc li > .ic-sub{width:46px;height:46px}
.ad-tp-nav button .ic-sub{width:28px;height:28px}
.ad-rel button .ic-sub{width:32px;height:32px}
.ad-lq .ic-sub{width:38px;height:38px}
.ad-fl-meta > .ic-sub{width:34px;height:34px}

/* -- blocos: cartao branco, borda fina, 16 px; dentro, sem caixas novas -- */
.ad-bloco{background:var(--folha);border:1px solid var(--linha);border-radius:16px;padding:18px 22px 10px;margin:22px 0 0;box-shadow:0 1px 2px rgba(21,25,51,.04)}
html.ad[data-theme="dark"] .ad-bloco{box-shadow:none}
.ad-bloco[hidden]{display:none}
html.ad .ad-bloco > h2.sec,html.ad .ad-bloco > .ad-bl-cab > h2.sec{margin:0;padding:0 0 12px;font-size:19px}
.ad-bloco > h2.sec + *,.ad-bloco > .ad-bl-cab + *{border-top:1px solid var(--linha)}
.ad-bl-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px}
html.ad .ad-bl-cab > h2.sec{padding:0;flex:1}
html.ad .ad-bloco .vazio{border:0;padding:16px 4px;min-height:0;border-radius:0}
html.ad .ad-bloco .painel{padding:0}
.ad-bloco .ad-lista > :last-child,.ad-bloco .ad-fl-mods > :last-child{border-bottom:0}
.ad-blocos2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 22px}
/* revise por area: tudo num cartao; "Temas desta area" separado por uma linha vertical */
#ad-areas.ad-bloco{padding:20px 24px 14px;margin-top:22px}
html.ad #ad-areas > h2.sec{padding-bottom:12px}
#ad-areas .ad-ar-abas{border-top:1px solid var(--linha);padding-top:16px;border-bottom:1px solid var(--linha)}
#ad-areas .ad-ar-painel{padding:22px 0 6px}
@media (min-width:901px){#ad-areas .ad-ar-mods{border-left:1px solid var(--linha);padding-left:28px}}
.ad-ar-mods h4{margin-bottom:6px}
.ad-ar-m:last-child{border-bottom:0}
/* modulo: "O que voce vai encontrar" */
.ad-bl-enc .ad-enc li{padding:15px 4px}
.ad-bl-enc .ad-enc li:last-child{border-bottom:0}
.ad-bl-enc{margin-top:26px}
.ad-bl-enc .ad-mp-pc{margin:4px 0 6px;border-top:1px solid var(--linha);padding-top:12px}
/* desempenho e simulados: a grade de temas dentro do cartao */
html.ad .ad-bl-desemp #desempenho{padding-top:4px}
html.ad #reforco .linha{border-radius:0}
.ad-bl-ref{padding-bottom:12px}
/* flashcards: Area e Tema em dois cartoes */
#v-revisao .ad-bl-fla .ad-ar-abas{border-bottom:0;padding:16px 0 10px;margin:0}
.ad-fl-img{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linha);background:transparent;color:var(--tinta);font:500 15px var(--disp);padding:7px 14px 7px 11px;border-radius:999px;cursor:pointer}
.ad-fl-img .ic-ui{width:18px;height:18px;color:var(--ad-t)}
.ad-fl-img small{font-size:13px;color:var(--lapis);font-variant-numeric:tabular-nums}
.ad-fl-img[aria-pressed="true"]{background:var(--acento-sv);border-color:transparent;box-shadow:var(--anel-sel);font-weight:600}
@media (hover:hover) and (pointer:fine){.ad-fl-img:hover{border-color:var(--borda2)}}

/* -- o que importa chama mais atencao: botao principal cheio, maior, sombra suave; numeros em destaque -- */
html.ad{--sombra-pri:0 1px 2px color-mix(in srgb,var(--ad-c) 30%,transparent),0 8px 18px -8px color-mix(in srgb,var(--ad-c) 75%,transparent)}
html.ad[data-theme="dark"]{--sombra-pri:0 8px 20px -10px color-mix(in srgb,var(--ad-c) 70%,transparent)}
html.ad .btn.ad-comecar,html.ad #v-inicio .capa .btn:not(.sec),html.ad #b-conf,html.ad #b-prox,html.ad .ad-fl-acoes #ad-fl-corr,html.ad #ad-rev-ja,html.ad #ad-fl-mais{box-shadow:var(--sombra-pri)}
html.ad #v-inicio .capa .btn:not(.sec){font:700 18px var(--disp);padding:15px 30px;min-height:56px;border-radius:13px}
html.ad #v-inicio .capa .btn.sec{min-height:56px;padding:15px 24px}
html.ad .entra2 > .acoes #b-conf,html.ad .entra2 > .acoes #b-prox{font:700 18px var(--disp);min-height:54px;padding:14px 26px;border-radius:13px}
html.ad #q-corpo:not(:has(#bolhas .bolha.sel)) #b-conf{box-shadow:none}
html.ad .ad-fl-acoes #ad-fl-corr{font-weight:700;min-height:56px}
.ad-stat b{font-size:22px;font-weight:700;letter-spacing:-.2px}
.ad-stat b:first-child{color:var(--ad-t)}
.ad-fx-i .n{font-weight:600;color:var(--tinta)}
.ad-fl-nums b{font-size:40px}
@media (hover:hover) and (pointer:fine){html.ad .btn.ad-comecar:hover,html.ad #v-inicio .capa .btn:not(.sec):hover,html.ad #b-conf:hover,html.ad #ad-fl-corr:hover{transform:translateY(-1px)}}

/* -- flashcards com imagem: imagem grande acima da resposta, zoom ao clicar, credito pequeno -- */
.ad-fl-fig{margin:-6px 0 22px}
.ad-fl-zoom{position:relative;display:block;width:100%;padding:10px;border:1px solid var(--linha);border-radius:14px;background:#fff;cursor:zoom-in}
.ad-fl-zoom img{display:block;width:100%;max-width:640px;max-height:min(46vh,480px);object-fit:contain;margin:0 auto}
.ad-fl-zoom .lupa{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,#17181C 72%,transparent);color:#fff;opacity:.8}
.ad-fl-zoom .lupa svg{width:18px;height:18px}
.ad-fl-fig figcaption{margin-top:6px;font-size:12.5px;color:var(--fraco);text-align:right}
@media (hover:hover) and (pointer:fine){.ad-fl-zoom:hover .lupa{opacity:1}.ad-fl-zoom:hover{border-color:var(--borda2)}}
@media (max-width:700px){.ad-fl-zoom{padding:6px}.ad-fl-zoom img{max-height:40vh}}
.ad-amp-caixa.um .ad-amp-pe .a,.ad-amp-caixa.um .ad-amp-pe .p,.ad-amp-caixa.um .ad-amp-topo span{visibility:hidden}
.ad-amp-img.fit{place-items:center}
.ad-amp-img.fit img{width:auto;max-width:100%;max-height:calc(100vh - 190px);height:auto}
.ad-bl-mods{padding:8px 14px;margin-top:6px}
.ad-bl-mods .ad-mc{border-radius:0}
@media (max-width:700px){
  .ad-bloco{padding:16px 16px 8px;border-radius:14px}
  #ad-areas.ad-bloco{padding:16px 16px 10px}
  .ad-bl-cab .ad-fl-img{order:2}
}

/* ==== 4a rodada (30/10): conteudos e areas com o desenho realista, simulados com desenho proprio ==== */
/* objeto solto, como os de modulo: sem ladrilho, sem cor de traco */
html.ad img.ic-sub{background:none;box-shadow:none;border-radius:0}
.ad-rel button img.ic-tema{width:34px;height:34px;flex:none}
.ad-ar-abas button img.ic-tema{width:32px;height:32px;flex:none;margin:-3px 0}
.ad-tp-nav button img.ic-tema{width:28px;height:28px;flex:none;margin:-3px 0}
.ad-tp-g > h2 img.ic-tema{width:46px;height:46px;flex:none}
.ad-fl-meta > img.ic-tema{width:36px;height:36px}
.ad-lq img.ic-sub{width:38px;height:38px}
.ad-enc li > img.ic-sub{width:48px;height:48px;margin:-2px}
.ad-teo-rot img.ic-tema,.ad-bx button > img.ic-tema:first-child{width:32px;height:32px}
/* pilula selecionada (cor cheia): um disco claro bem leve atras do objeto, para ele nao sumir no fundo colorido */
.ad-ar-abas button[aria-selected="true"] img.ic-tema,.ad-ar-abas button[aria-pressed="true"] img.ic-tema{background:rgba(255,255,255,.88);border-radius:50%;padding:2px;box-sizing:border-box}
html.ad[data-theme="dark"] .ad-ar-abas button[aria-selected="true"] img.ic-tema,html.ad[data-theme="dark"] .ad-ar-abas button[aria-pressed="true"] img.ic-tema{background:rgba(255,255,255,.14)}
@media (max-width:700px){.ad-tp-g > h2 img.ic-tema{width:36px;height:36px}.ad-enc li > img.ic-sub{width:40px;height:40px}.ad-fl-meta > img.ic-tema{width:30px;height:30px}}
/* simulados: o desenho solto no lugar do quadradinho com icone repetido */
.ad-sim{grid-template-columns:48px minmax(0,1fr) auto 20px}
html.ad .ad-sim .ic.real{width:48px;height:48px;background:none;border:0;box-shadow:none;border-radius:0}
html.ad .ad-sim.uni .ic.real{width:52px;height:52px;margin:-2px}
.ad-sim .ic .ic-simr{width:100%;height:100%;display:block;object-fit:contain}
.ad-sim small.bc{font:600 13px var(--disp);letter-spacing:.02em;color:var(--ad-t);margin-top:3px}
@media (max-width:600px){.ad-sim{grid-template-columns:44px minmax(0,1fr) 16px}html.ad .ad-sim .ic.real,html.ad .ad-sim.uni .ic.real{width:44px;height:44px;margin:0}}
/* cartao de teoria: o objeto realista solto, sem a caixinha tingida */
.ad-c-ic:has(img.ic-tema){background:none;border-radius:0}
.ad-c-ic img.ic-tema{width:50px;height:50px}
.ad-cartao.compacto .ad-c-ic img.ic-tema{width:40px;height:40px}

/* ==== dicionario "passe o mouse" (30/10): termo marcado + caixinha estilo Kindle ==== */
html.ad .ad-dic{text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:.22em;
  text-decoration-color:color-mix(in srgb,var(--ad-t) 55%,transparent);cursor:help;border-radius:3px;transition:background-color .15s}
html.ad .ad-dic:hover,html.ad .ad-dic.on{background:color-mix(in srgb,var(--ad-c) 13%,transparent);text-decoration-color:var(--ad-t)}
html.ad .ad-dic:focus{outline:none}
html.ad .ad-dic:focus-visible{outline:2px solid var(--ad-t);outline-offset:1px}
.ad-dic-caixa{position:fixed;z-index:2147483000;left:0;top:0;box-sizing:border-box;width:max-content;max-width:min(320px,calc(100vw - 16px));
  padding:12px 14px 11px;border-radius:12px;background:var(--folha,#fff);color:var(--tinta,#17181C);
  border:1px solid color-mix(in srgb,var(--tinta,#17181C) 12%,transparent);
  box-shadow:0 10px 28px -8px rgba(20,22,30,.28),0 2px 6px rgba(20,22,30,.08);
  font:400 14px/1.45 var(--disp,Inter,system-ui,sans-serif);text-align:left;pointer-events:auto;opacity:0;transform:translateY(-3px)}
.ad-dic-caixa.cima{transform:translateY(3px)}
.ad-dic-caixa.vis{opacity:1;transform:none;transition:opacity .14s ease-out,transform .14s ease-out}
.ad-dic-caixa[hidden]{display:none}
.ad-dic-caixa .t{display:block;font:700 15px/1.3 var(--disp,Inter,system-ui,sans-serif);margin:0 0 6px;color:var(--tinta,#17181C)}
.ad-dic-caixa p{margin:0 0 6px}
.ad-dic-caixa p:last-of-type{margin-bottom:0}
.ad-dic-caixa .r{display:block;font:600 11.5px/1.3 var(--disp,Inter,system-ui,sans-serif);letter-spacing:.04em;text-transform:uppercase;color:var(--ad-t,#585B64);margin:0 0 1px}
.ad-dic-caixa .o{padding:6px 8px;margin:6px -2px;border-radius:8px;background:color-mix(in srgb,var(--ad-c) 9%,transparent)}
.ad-dic-caixa .x{color:var(--lapis,#585B64);font-style:italic}
.ad-dic-caixa .x .r{font-style:normal}
.ad-dic-caixa .seta{position:absolute;left:var(--sx,50%);top:-6px;width:11px;height:11px;margin-left:-5.5px;background:inherit;
  border-left:1px solid color-mix(in srgb,var(--tinta,#17181C) 12%,transparent);border-top:1px solid color-mix(in srgb,var(--tinta,#17181C) 12%,transparent);transform:rotate(45deg)}
.ad-dic-caixa.cima .seta{top:auto;bottom:-6px;transform:rotate(225deg)}
html.ad[data-theme="dark"] .ad-dic-caixa{background:var(--folha2);box-shadow:0 12px 30px -8px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3)}
html.ad[data-theme="light"].m-por .ad-dic-caixa .o{background:color-mix(in srgb,var(--ad-c) 16%,transparent)}
@media (prefers-reduced-motion:reduce){.ad-dic-caixa,.ad-dic-caixa.vis{transition:none;transform:none}}

/* ---------- RESOLUCAO MAIS DIRETA (rodada 6; materia.js "enxuga") ---------- */
/* linha de leitura de ~68 caracteres */
html.ad #ad-painel .resolucao :is(p,.ess p,.errada p,.checa,.armad,.antes p,.porque){max-width:68ch}
/* Resposta no topo: e' a primeira coisa depois do veredito */
html.ad #ad-painel .resolucao > .ad-topo{margin-top:16px}
html.ad #ad-painel .resolucao > .ad-topo:first-child{margin-top:0}
html.ad #ad-painel .resolucao > .alerta-box.ad-topo{font-size:15px;line-height:1.55}
html.ad #ad-painel .resolucao > .ad-fig{margin-top:18px}
html.ad #ad-painel .resolucao > .sua-topo .errada.sua{border-top:0}
/* blocos recolhidos: uma linha com o que tem dentro; abre com um clique */
html.ad #ad-painel details.ad-rec{border-radius:12px;background:color-mix(in srgb,var(--tinta) 4.5%,transparent)}
html.ad #ad-painel details.ad-rec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;font:600 16px/1.35 var(--disp);color:var(--tinta)}
html.ad #ad-painel details.ad-rec > summary::-webkit-details-marker{display:none}
html.ad #ad-painel details.ad-rec > summary::before{content:"";width:7px;height:7px;flex:none;margin:0 3px 0 2px;border-right:2px solid var(--lapis);border-bottom:2px solid var(--lapis);transform:rotate(-45deg);transition:transform .18s var(--curva,ease)}
html.ad #ad-painel details.ad-rec[open] > summary::before{transform:rotate(45deg) translate(-2px,-1px)}
html.ad #ad-painel details.ad-rec > summary .t{flex:1 1 auto;min-width:0}
html.ad #ad-painel details.ad-rec > summary small{font:500 14px var(--disp);color:var(--lapis);font-variant-numeric:tabular-nums}
html.ad #ad-painel details.ad-rec > summary:focus-visible{outline:2px solid var(--ad-c);outline-offset:2px}
html.ad #ad-painel details.ad-rec[open]{padding-bottom:6px}
html.ad #ad-painel details.ad-rec[open] > :not(summary){margin-left:14px;margin-right:14px}
html.ad #ad-painel details.ad-rec[open] > summary{margin-bottom:2px}
html.ad #ad-painel details.ad-rec .antes > :first-child{margin-top:0}
html.ad #ad-painel details.ad-rec .antes{padding-bottom:8px}
html.ad #ad-painel details.ad-rec-err > .errada:first-of-type{border-top:0}
html.ad #ad-painel .antes details.ad-rec-teo{margin-top:12px}
html.ad #ad-painel .antes details.ad-rec-teo > p{margin-top:0}
/* glossario sem duplicata: o termo ja e' toque/caixinha no texto */
html.ad #ad-painel .simbolos .ad-dup,html.ad #ad-painel dl.simbolos.ad-dup{display:none}
/* link discreto ("por que, completo", "ver a armadilha completa") */
html.ad #ad-painel .ad-mais{border:0;background:none;padding:2px 0;margin:0;cursor:pointer;font:600 14px/1.4 var(--disp);color:var(--ad-t);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--ad-t) 45%,transparent)}
html.ad #ad-painel .ad-mais:focus-visible{outline:2px solid var(--ad-c);outline-offset:2px;border-radius:4px}
html.ad #ad-painel .ess .ad-mais{white-space:nowrap}
html.ad #ad-painel .bloco.ad-arm-rep{margin-top:10px}
/* "por que" longo: 2 linhas e "por que, completo"; no passo que esta sendo animado, inteiro */
html.ad #ad-painel .passo .porque.ad-clamp{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:0}
html.ad #ad-painel .passo.ad-atual .porque.ad-clamp{display:block;-webkit-line-clamp:unset;overflow:visible}
html.ad #ad-painel .passo.ad-atual .ad-mais-pq,html.ad #ad-painel .passo:not(:has(.porque.ad-clamp)) .ad-mais-pq[aria-expanded="false"]{display:none}
html.ad #ad-painel .passo .ad-mais-pq{display:block;margin-top:2px}
/* resultado da conta marcado a marca-texto */
html.ad #ad-painel .passo .conta mark.ad-fim{background:linear-gradient(transparent 55%,var(--marca-cad) 55%);color:inherit;padding:0 1px;border-radius:2px}
/* passo sem conta: o "por que" vira o miolo do passo (moldura de caderno, letra de leitura) */
html.ad #ad-painel .passo.ad-sem-conta .porque{background-color:var(--papel-cad);background-image:linear-gradient(var(--grade-suave) 1px,transparent 1px),linear-gradient(90deg,var(--grade-suave) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;border:1px solid var(--borda-cad);border-radius:8px;padding:8px 14px;color:var(--tinta-cad)}

/* chip honesto: "calcular" sem conta nenhuma nao aparece */
